name: Alder JSON Plugin Gate B
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/document_storage/**'
      - 'work/viewer-json/issue-274/json-native/**'
      - 'tools/test_json_plugin.py'
      - 'tools/export_plugin_references.py'
      - 'plugins/alder/**'
      - 'work/plugin-json/issue-273/**'
      - '.github/workflows/document-storage-plugin.yml'
      - '.github/workflows/actions.lock'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: node --test tools/document_storage/test-native-json.mjs tools/document_storage/test-storage.mjs tools/document_storage/test-authoring.mjs tools/document_storage/test-states.mjs tools/document_storage/test-roles.mjs
      - run: python3 -m unittest tools/test_json_plugin.py tools/test_export_plugin_references.py
      - run: python3 tools/export_plugin_references.py --check --skill alder-manage-json-documents
      - run: python3 -m unittest discover -s tools/business_graph -p 'test_*.py'
