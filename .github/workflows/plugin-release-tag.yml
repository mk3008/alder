name: Alder release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved Alder X.Y.Z version'
        required: true
        type: string
      revision:
        description: 'Approved full main commit SHA'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['.github/alder-release-request.json']
  pull_request:
    paths:
      - '.github/workflows/plugin-release-tag.yml'
      - '.github/workflows/actions.lock'
      - '.github/alder-release-request.json'
      - 'tools/resolve_release_request.py'
      - 'tools/test_release_request.py'
      - 'docs/release-notes-v*.md'
      - 'docs/versioning.md'
      - 'tools/validate_release.py'
      - 'plugins/alder/**'
      - '.agents/plugins/marketplace.json'
      - 'docs/adoption.md'
      - 'tools/test_plugin_package.py'
      - 'tools/test_plugin_references.py'
      - 'tools/export_plugin_references.py'
      - 'tools/test_export_plugin_references.py'
      - 'tools/fetch_plugin_sources.py'
      - 'tools/test_fetch_plugin_sources.py'
      - 'tools/test_workflow_skills.py'
      - 'tools/check_activity_names.py'
      - 'tools/test_plugin_release_workflow.py'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.request.outputs.version }}
      revision: ${{ steps.request.outputs.revision }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest tools.test_release_request
      - name: Resolve pinned release target
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REVISION: ${{ github.sha }}
        run: >-
          python3 tools/resolve_release_request.py --event-name "$EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH" --ref "$EVENT_REF"
          --revision "$EVENT_REVISION" --output "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch exact plugin provenance sources
        run: python3 tools/fetch_plugin_sources.py
      - name: Fetch pinned historical Check fixtures
        run: git fetch --no-tags origin c0020d3f88fa7ce70b17c197464978bb548f9100 d453b61be8520907bf7326ffbe429ca55feea9d8
      - run: python3 -m unittest tools.test_plugin_package tools.test_workflow_skills tools.test_plugin_release_workflow tools.test_export_plugin_references tools.test_plugin_references tools.test_fetch_plugin_sources
      - run: python3 -m unittest discover -s tools/business_graph -p 'test_*.py'
      - run: python3 -m unittest discover -s work/traceability-drift -p 'test_*.py'
      - run: python3 work/traceability-drift/evaluate.py --output /tmp/drift-observations.json
      - name: Validate candidate inputs
        if: needs.resolve.outputs.publish == 'false'
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: python3 tools/validate_release.py --revision "$REVISION"
      - name: Validate approved release inputs
        if: needs.resolve.outputs.publish == 'true'
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          APPROVED_VERSION: ${{ needs.resolve.outputs.version }}
          APPROVED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: python3 tools/validate_release.py --revision "$REVISION" --approved-version "$APPROVED_VERSION" --approved-revision "$APPROVED_REVISION"

  release:
    if: needs.resolve.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: alder-product-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Publish approved Alder version without moving existing tags
        uses: actions/github-script@v7.1.0
        env:
          APPROVED_VERSION: ${{ needs.resolve.outputs.version }}
          APPROVED_REVISION: ${{ needs.resolve.outputs.revision }}
        with:
          script: |
            if (!['workflow_dispatch', 'push'].includes(context.eventName) || context.ref !== 'refs/heads/main') {
              throw new Error('Alder publication requires a resolved main-branch release request or dispatch.');
            }
            const fs = require('node:fs');
            const repo = context.repo;
            const version = JSON.parse(fs.readFileSync('plugins/alder/plugin.json', 'utf8')).version;
            const inputs = {version: process.env.APPROVED_VERSION, revision: process.env.APPROVED_REVISION};
            const targetRevision = inputs.revision;
            const checkedRevision = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) throw new Error('Invalid stable product version.');
            const [major, minor, patch] = version.split('.').map(Number);
            if (major === 0 && (minor < 4 || (minor === 4 && patch < 4))) throw new Error('Historical releases are immutable.');
            if (inputs.version !== version || !/^[0-9a-f]{40}$/.test(inputs.revision || '') || targetRevision !== checkedRevision) {
              throw new Error('Approved version and revision must match the checked workflow commit.');
            }
            const body = fs.readFileSync(`docs/release-notes-v${version}.md`, 'utf8');
            const title = body.split(/\r?\n/, 1)[0];
            if (title !== `# Alder ${version}` && !title.startsWith(`# Alder ${version} — `)) throw new Error('Invalid release notes.');
            const releaseBody = body.slice(title.length).trim();
            if (!releaseBody || releaseBody.startsWith('#')) throw new Error('Release notes must start with a prose summary, not another heading.');
            const tag = `plugin-v${version}`;
            const getOptional = async (request) => {
              try { return (await request()).data; }
              catch (error) { if (error.status === 404) return null; throw error; }
            };
            const released = await getOptional(() => github.rest.repos.getReleaseByTag({ ...repo, tag }));
            const ref = await getOptional(() => github.rest.git.getRef({ ...repo, ref: `tags/${tag}` }));
            if (ref) {
              let object = ref.object;
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({ ...repo, tag_sha: object.sha })).data.object;
              }
              if (object.type !== 'commit' || object.sha !== targetRevision) {
                throw new Error(`Existing ${tag} targets another revision; refusing to move or release it.`);
              }
            }
            if (released) {
              if (!ref || released.draft || released.prerelease || released.tag_name !== tag) {
                throw new Error('Existing release is not a stable non-draft release at its expected fixed tag.');
              }
              core.info(`Verified existing release at ${targetRevision}: ${released.html_url}`);
              return;
            }
            // One API action creates a missing tag and release at this checked revision.
            const { data } = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: targetRevision,
              name: `Alder ${version}`, body: releaseBody, draft: false, prerelease: false,
              make_latest: 'true',
            });
            core.info(data.html_url);
