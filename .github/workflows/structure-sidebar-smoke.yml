name: Structure sidebar browser check
on:
  push:
    branches:
      - 'work/357-sidebar-browser-cca3bb1e'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/viewer-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Japanese review-image font
        run: |
          if ! fc-match -f '%{family}\n' ':lang=ja' | grep -q 'Noto.*CJK'; then
            FONT_FILE="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 --retry 1 --retry-max-time 120 https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf --output "$FONT_FILE"
            test "$(git hash-object "$FONT_FILE")" = f56224957fb13a81b4c14bac34f2f058a017f9fb
            mkdir -p "$HOME/.local/share/fonts"
            install -m 644 "$FONT_FILE" "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
            fc-cache -f "$HOME/.local/share/fonts"
          fi
          fc-match -f '%{family}\n' ':lang=ja' | grep 'Noto.*CJK'
      - name: Check structure sidebar at desktop and mobile widths
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/viewer-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-browser/node_modules/playwright"
          node web/test-browser.mjs --cases structureSampleHeader
      - name: Verify public preview and source
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 'https://mk3008.github.io/alder/preview/pr-357/cca3bb1e2ba15819d619ac6d4b314a8e64a89ea3-sidebar/index.html' --output "$RUNNER_TEMP/sidebar-index.html"
          test "$(sha256sum "$RUNNER_TEMP/sidebar-index.html" | cut -d' ' -f1)" = 36d4746f45bf349adf4fed994e7e52af549054523c689aaa52ca66ada6a5932b
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 'https://mk3008.github.io/alder/preview/pr-357/cca3bb1e2ba15819d619ac6d4b314a8e64a89ea3-sidebar/examples/json-complete-concept-review.json' --output "$RUNNER_TEMP/sidebar-source.json"
          cmp "$RUNNER_TEMP/sidebar-source.json" ../business-design/alder/json-complete-concept-review.json
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: structure-sidebar-screenshots
          path: web-viewer/web/evidence/structure-explorer-sidebar/*.png
          if-no-files-found: ignore
          retention-days: 7
