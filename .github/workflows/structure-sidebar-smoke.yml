name: Verify concept domain navigation contracts
on:
  push:
    branches:
      - 'work/357-sidebar-browser-cca3bb1e'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git fetch --no-tags --depth=1 origin 55d69577d0cf2faf54f5ab49c1e2495a7d43698e
      - run: npm run verify:contract
