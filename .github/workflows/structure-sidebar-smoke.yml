name: Verify published explorer preview
on:
  push:
    branches:
      - 'work/357-sidebar-browser-cca3bb1e'
permissions:
  contents: read
jobs:
  published-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify delivered HTML, assets and JSON
        run: |
          base='https://mk3008.github.io/alder/preview/pr-357/ca7c1af7857132242f2a9422e65932a977fa61d9-resizable-explorer'
          verify() {
            curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$base/$1" --output "$RUNNER_TEMP/viewer-content"
            test "$(sha256sum "$RUNNER_TEMP/viewer-content" | cut -d' ' -f1)" = "$2"
          }
          verify index.html 189d3efb79dfe99750b8b996ef13356cb8bbeedfdf7dbf1733f40b65fee6c5ae
          verify assets/main-Dmfp9eiA.js 795541c4c25e9f14ab7c669372b2d1d0752a089cb36188b288a9019e89c59447
          verify assets/main-Dp94TowD.css 8ab5f05912e7a9dde7c128c994523125eda61f583b9e377aba778c84f1f36cf4
          verify examples/json-complete-concept-review.json 1f8abc11ad3ff741acb6e4e26ce7c47ac1a02327e6a6fa99941a6e54acf5bec7
