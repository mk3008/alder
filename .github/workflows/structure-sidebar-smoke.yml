name: Verify published conceptual model preview
on:
  push:
    branches:
      - 'work/357-sidebar-browser-cca3bb1e'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify publicly served files against fixed build
        run: |
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors 'https://mk3008.github.io/alder/preview/pr-357/41da11e35d7d77d8f568d2351f191e144e29a5a8-value-domains/index.html' --output "$RUNNER_TEMP/item0"
          printf '%s  %s\n' '0fb0151097e6297f5aed26c457415444977d117b57526ba2da8fda5bd5ca29d0' "$RUNNER_TEMP/item0" | sha256sum --check
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors 'https://mk3008.github.io/alder/preview/pr-357/41da11e35d7d77d8f568d2351f191e144e29a5a8-value-domains/assets/main-B3ohjT-w.js' --output "$RUNNER_TEMP/item1"
          printf '%s  %s\n' '9bb9d1de7d9cdbb5da5984dcdc2772e1bad90bc4fddc9f7caf1e78dec2faaa4e' "$RUNNER_TEMP/item1" | sha256sum --check
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors 'https://mk3008.github.io/alder/preview/pr-357/41da11e35d7d77d8f568d2351f191e144e29a5a8-value-domains/assets/main-1x1OWUjf.css' --output "$RUNNER_TEMP/item2"
          printf '%s  %s\n' '46c368fa8b06c91fd7b630992a48a31178178c079cabeaef0e603a624fbb6d00' "$RUNNER_TEMP/item2" | sha256sum --check
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors 'https://mk3008.github.io/alder/preview/pr-357/41da11e35d7d77d8f568d2351f191e144e29a5a8-value-domains/examples/json-complete-concept-review.json' --output "$RUNNER_TEMP/item3"
          printf '%s  %s\n' '5eacaf2d16da2a2dbc86d071526c1570a9c2085f1ac6ed3ea86f6d208c1f4fa7' "$RUNNER_TEMP/item3" | sha256sum --check
