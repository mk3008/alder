name: Web Viewer display validation
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'web-viewer/**'
      - '.github/workflows/web-viewer-once.yml'
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/viewer-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Japanese review-image font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}\n' ':lang=ja'
      - name: Verify built app in Chrome
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/viewer-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-browser/node_modules/playwright" node web/test-browser.mjs

      - name: Capture purchase caption comparison
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-browser/node_modules/playwright" node web/capture-source-captions.mjs

      - name: Preserve header review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-controls-${{ github.sha }}
          path: web-viewer/web/evidence/header-controls/*.png
          if-no-files-found: ignore
      - name: Retain save-conflict review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-conflict-review-${{ github.sha }}
          path: web-viewer/web/evidence/save-conflict-212/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain findings review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-findings-review-${{ github.sha }}
          path: web-viewer/web/evidence/design-findings-96/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain wiring review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiring-review-${{ github.event.pull_request.head.sha }}
          path: |
            web-viewer/web/evidence/wiring/real-*.png
            web-viewer/web/evidence/wiring/source-captions-255.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Package isolated review Preview
        if: success()
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import {mkdirSync,cpSync,writeFileSync,readdirSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const head=process.env.REVIEW_HEAD,pr=process.env.REVIEW_PR;
          const path=`review-package/preview/pr-${pr}/${head}/`;
          mkdirSync(path,{recursive:true});cpSync('dist',path,{recursive:true});
          const files=readdirSync('dist',{recursive:true}).filter(f=>/\.(?:html|js|css|txt)$/.test(f));
          const manifest={source:head,checkout:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),urlPath:`/preview/pr-${pr}/${head}/`,files:Object.fromEntries(files.map(f=>[f,createHash('sha256').update(readFileSync(`dist/${f}`)).digest('hex')]))};
          writeFileSync('review-package/manifest.json',JSON.stringify(manifest,null,2));
          writeFileSync('review-package/README.txt',`本番とは分離した操作確認用ビルドです。\nsource: ${head}\n展開先で python3 -m http.server 4173 を実行し、http://localhost:4173/preview/pr-${pr}/${head}/ を開きます。\n一般公開や本番配備は行いません。\n`);
          JS
      - name: Retain isolated review Preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: web-viewer/review-package/
          retention-days: 14
      - name: Retain related Check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: related-checks-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/related-checks/*.png
          if-no-files-found: ignore
          retention-days: 14
