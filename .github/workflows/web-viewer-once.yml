name: Web Viewer display validation
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'web-viewer/**'
      - 'tools/viewer-preview.mjs'
      - 'work/viewer-json/issue-274/layout-regression/**'
      - 'tools/document_storage/core.mjs'
      - 'tools/document_storage/schema.mjs'
      - 'tools/document_storage/legacy-json.mjs'
      - 'tools/document_storage/state-declaration.mjs'
      - 'work/viewer-json/issue-274/json-native/**'
      - '.github/workflows/web-viewer-once.yml'
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify UI verification authority
        run: npm run verify:contract
      - run: npm test
      - run: npm run build
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/viewer-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Japanese review-image font
        run: |
          if ! fc-match -f '%{family}\n' ':lang=ja' | grep -q 'Noto.*CJK'; then
            FONT_FILE="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 --retry 1 --retry-max-time 120 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf \
              --output "$FONT_FILE"
            test "$(git hash-object "$FONT_FILE")" = f56224957fb13a81b4c14bac34f2f058a017f9fb
            mkdir -p "$HOME/.local/share/fonts"
            install -m 644 "$FONT_FILE" "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
            fc-cache -f "$HOME/.local/share/fonts"
          fi
          fc-match -f '%{family}\n' ':lang=ja' | grep 'Noto.*CJK'
      - name: Select bounded B-loop comparison
        id: b_loop
        run: |
          if git show -s --format=%B "$REVIEW_HEAD" | grep -qx 'Benchmark-B-Loop: 441dfb8b'; then
            git fetch --no-tags --depth=1 origin 441dfb8b2fbf36bb4215ec885852dc14fa6a3e59
            git worktree add --detach "$RUNNER_TEMP/b-loop-baseline" 441dfb8b2fbf36bb4215ec885852dc14fa6a3e59
            ln -s "$GITHUB_WORKSPACE/web-viewer/node_modules" "$RUNNER_TEMP/b-loop-baseline/web-viewer/node_modules"
            cp -a "$GITHUB_WORKSPACE/web-viewer/dist" "$RUNNER_TEMP/b-loop-baseline/web-viewer/dist"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify built app in Chrome
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/viewer-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/viewer-browser/node_modules/playwright"
          if [ "${{ steps.b_loop.outputs.enabled }}" = true ]; then
            node web/measure-b-loop.mjs "$RUNNER_TEMP/b-loop-baseline/web-viewer"
          else
            node web/test-browser.mjs
          fi

      - name: Retain bounded B-loop measurements
        if: always() && steps.b_loop.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: b-loop-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/b-loop/
          if-no-files-found: error
          retention-days: 14
      - name: Retain MD JSON geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-layout-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/json-layout/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve shell review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-shell-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/shell/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve header review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-controls-${{ github.sha }}
          path: web-viewer/web/evidence/header-controls/*.png
          if-no-files-found: ignore
      - name: Retain JSON review screenshots and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-document-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/json-document/
          if-no-files-found: error
          retention-days: 14
      - name: Retain save-conflict review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-conflict-review-${{ github.sha }}
          path: web-viewer/web/evidence/save-conflict-212/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain findings review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-findings-review-${{ github.sha }}
          path: web-viewer/web/evidence/design-findings-96/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain wiring review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiring-review-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/wiring/real-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Package isolated review Preview
        if: success()
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: node ../tools/viewer-preview.mjs
      - name: Retain isolated review Preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: web-viewer/review-package/
          retention-days: 14
      - name: Retain related Check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: related-checks-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/related-checks/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain state JSON comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-states-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/json-states/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain role JSON comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-roles-${{ github.event.pull_request.head.sha }}
          path: web-viewer/web/evidence/json-roles/
          if-no-files-found: ignore
          retention-days: 14
