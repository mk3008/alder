name: Verify published structure review
on:
  push:
    branches:
      - 'work/357-published-check-887c0f60'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Compare published files with the reviewed build
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const base='https://mk3008.github.io/alder/preview/pr-357/887c0f60a191d06e1db0ed50567844cca2ec1950-review-feedback/';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let last;
          for(let attempt=1;attempt<=36;attempt++){
            try{
              const response=await fetch(base+'preview-manifest.json',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(!response.ok)throw Error('manifest HTTP '+response.status);
              const manifest=await response.json();
              if(manifest.source!=='887c0f60a191d06e1db0ed50567844cca2ec1950'||manifest.sourceTree!=='ac53b13a5664e8870b65a88b355fe0ac1f5fb9c3')throw Error('Unexpected source commit or tree');
              if(manifest.files['examples/json-complete-concept-review.json']!=='e93657d3680bac31907b7d54e96498e79dcff8ffd66c420ef3ca9441cc5a7181')throw Error('Unexpected model checksum');
              const entries=Object.entries(manifest.files);
              if(entries.length<10)throw Error('Incomplete file manifest');
              for(const [path,expected] of entries){
                const asset=await fetch(base+path,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                if(!asset.ok)throw Error(path+' HTTP '+asset.status);
                const actual=createHash('sha256').update(Buffer.from(await asset.arrayBuffer())).digest('hex');
                if(actual!==expected)throw Error('Mismatch: '+path);
              }
              console.log(JSON.stringify({source:manifest.source,checked:entries.length,base}));process.exit(0);
            }catch(error){last=error;console.log('Attempt '+attempt+': '+error.message);await sleep(5000);}
          }
          throw last;
          NODE
