name: Business Graph

on:
  pull_request:
    paths:
      - 'tools/business_graph/**'
      - 'business-design/alder/**'
      - 'docs/business-graph.md'
      - 'docs/decisions/0079-business-graph-export.md'
      - '.github/workflows/business-graph.yml'
  push:
    branches: [main]
    paths:
      - 'tools/business_graph/**'
      - 'business-design/alder/**'
      - 'docs/business-graph.md'
      - 'docs/decisions/0079-business-graph-export.md'
      - '.github/workflows/business-graph.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contract, CLI behavior and committed projection
        run: python3 -m unittest discover -s tools/business_graph -p 'test_*.py' -v
