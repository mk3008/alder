name: Verify public PR 279 JSON Pages beta
on:
  push:
    branches:
      - beta/pr-279-json-pages
    paths:
      - .github/workflows/verify-pr279-json-beta-public.yml
permissions:
  contents: read
jobs:
  public-link:
    if: github.repository == 'mk3008/alder'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PUBLIC_URL: https://mk3008.github.io/alder/preview/pr-279/9ed410b8ec571d25af0cb7f0577dea79b50f43b1/open-json.html
      SOURCE_SHA: 9ed410b8ec571d25af0cb7f0577dea79b50f43b1
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify public Pages route is served
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 15 -L "$PUBLIC_URL" -o "$RUNNER_TEMP/beta-public-link.html"; then
              if grep -Fq "$SOURCE_SHA" "$RUNNER_TEMP/beta-public-link.html"; then break; fi
            fi
            sleep 4
          done
          grep -Fq "$SOURCE_SHA" "$RUNNER_TEMP/beta-public-link.html"
          echo "Published direct link contains the fixed JSON source commit."
      - name: Verify real Chrome URL to work-branch JSON
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/public-beta-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          cat > "$RUNNER_TEMP/verify-public-beta.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:860}});
          const page=await context.newPage(),requests=[],errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('request',r=>requests.push({url:r.url(),method:r.method()}));
          try{
            await page.goto(process.env.PUBLIC_URL,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#nodes')?.children.length===25,null,{timeout:45000});
            assert.equal(await page.locator('#nodes > *').count(),25);
            assert.ok(requests.some(r=>r.url.includes('raw.githubusercontent.com/mk3008/alder/'+process.env.SOURCE_SHA+'/')),'Must fetch fixed JSON from work-branch commit');
            assert.ok(requests.every(r=>r.method==='GET'),'No uploads');
            assert.deepEqual(errors,[]);
            console.log(JSON.stringify({passed:true,publicUrl:process.env.PUBLIC_URL,title:await page.title(),nodeCount:25,sourceRequests:requests.filter(r=>r.url.includes('raw.githubusercontent.com')),pageErrors:errors}));
          }finally{
            await context.close();
            await browser.close();
          }
          JS
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/public-beta-browser/node_modules/playwright" node "$RUNNER_TEMP/verify-public-beta.mjs"
