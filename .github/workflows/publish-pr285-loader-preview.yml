name: Publish isolated PR 285 Viewer review preview
on:
  push:
    branches:
      - beta/pr-285-loader-pages
    paths:
      - .github/workflows/publish-pr285-loader-preview.yml
permissions:
  contents: write
concurrency:
  group: pr285-loader-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'mk3008/alder'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: a8c5ce82381de406fbaa59affe7996e522d15c2e
      SOURCE_CI: "39905950483"
    steps:
      - name: Require successful CI for the exact PR 285 head
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 20 "https://api.github.com/repos/mk3008/alder/actions/runs/$SOURCE_CI" -o "$RUNNER_TEMP/source-run.json"
          test "$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")" = "$SOURCE_SHA"
          test "$(jq -r .conclusion "$RUNNER_TEMP/source-run.json")" = "success"
          test "$(jq -r '.pull_requests[0].number' "$RUNNER_TEMP/source-run.json")" = "285"
      - name: Checkout reviewed Viewer source only
        uses: actions/checkout@v4
        with:
          ref: a8c5ce82381de406fbaa59affe7996e522d15c2e
          path: source
          persist-credentials: false
      - name: Checkout existing public Pages assets
        uses: actions/checkout@v4
        with:
          ref: gh-pages-web-viewer
          path: pages
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Build exactly the reviewed Viewer
        working-directory: source/web-viewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Stage only the new commit-fixed preview directory
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          DEST="pages/preview/pr-285/$SOURCE_SHA"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp -a source/web-viewer/dist/. "$DEST/"
          cp source/work/json-roles/issue-280/purchase.roles.json "$DEST/purchase.roles.json"
          cp source/work/json-roles/issue-280/same-business.roles.json "$DEST/same-business.roles.json"
          cp source/work/json-roles/issue-280/gate-b.roles.json "$DEST/gate-b.roles.json"
          cp source/work/viewer-json/issue-274/layout-regression/same-business.md "$DEST/same-business.md"
          export DEST
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const dest=process.env.DEST,sha=process.env.SOURCE_SHA;
          const base='https://raw.githubusercontent.com/mk3008/alder/'+sha+'/';
          const sources={
            purchase:'work/json-roles/issue-280/purchase.roles.json',
            states:'work/json-roles/issue-280/purchase.roles.json',
            json:'work/json-roles/issue-280/same-business.roles.json',
            md:'work/viewer-json/issue-274/layout-regression/same-business.md',
            checks:'work/json-roles/issue-280/gate-b.roles.json'
          };
          for(const [name,source] of Object.entries(sources)){
            const link='./#source='+encodeURIComponent(base+source);
            const html='<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alder Viewer review '+name+'</title><meta http-equiv="refresh" content="0;url='+link+'"><script>location.replace('+JSON.stringify(link)+')</script><p><a href="'+link+'">Viewerを開く</a></p></html>';
            fs.writeFileSync(path.join(dest,'open-'+name+'.html'),html);
          }
          const files=['index.html',...fs.readdirSync(path.join(dest,'assets')).map(n=>'assets/'+n)];
          const sha256=file=>createHash('sha256').update(fs.readFileSync(path.join(dest,file))).digest('hex');
          fs.writeFileSync(path.join(dest,'manifest.json'),JSON.stringify({review:'Draft PR 285',source:sha,kind:'isolated non-release Viewer preview',files:Object.fromEntries(files.map(f=>[f,sha256(f)])),sources},null,2)+'\n');
          JS
      - name: Install Japanese review-image font
        run: |
          if ! fc-match -f '%{family}\n' ':lang=ja' | grep -q 'Noto.*CJK'; then
            FONT_FILE="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 --retry 1 --retry-max-time 120 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf \
              --output "$FONT_FILE"
            test "$(git hash-object "$FONT_FILE")" = f56224957fb13a81b4c14bac34f2f058a017f9fb
            mkdir -p "$HOME/.local/share/fonts"
            install -m 644 "$FONT_FILE" "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
            fc-cache -f "$HOME/.local/share/fonts"
          fi
          fc-match -f '%{family}\n' ':lang=ja' | grep 'Noto.*CJK'
      - name: Chrome smoke on common detail, state and Check links
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pr285-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          mkdir -p preview-evidence
          python3 -m http.server 4188 --bind 127.0.0.1 --directory pages > "$RUNNER_TEMP/pr285-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:4188/preview/pr-285/$SOURCE_SHA/index.html"; then break; fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/pr285-smoke.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const sample=name=>JSON.parse(fs.readFileSync('source/work/json-roles/issue-280/'+name+'.roles.json','utf8'));
          const business=sample('same-business'),purchase=sample('purchase'),checks=sample('gate-b');
          const chromium=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE).chromium;
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
          const base='http://127.0.0.1:4188/preview/pr-285/'+process.env.SOURCE_SHA+'/';
          const cases=[['json',393,25,63],['md',393,25,63],['states',393,12,23],['checks',393,6,6]];
          const results=[];
          try{
            for(const [kind,width,nodes,edges] of cases){
              const context=await browser.newContext({viewport:{width,height:960}});
              const page=await context.newPage(),errors=[],requests=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('request',r=>requests.push({method:r.method(),url:r.url()}));
              try{
                await page.goto(base+'open-'+kind+'.html',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(count=>document.querySelectorAll('.node').length===count,nodes,{timeout:45000});
                const count=await page.locator('.edge').count();
                assert.equal(count,edges,kind+' relation paths');
                if(kind==='purchase'){
                  const labels=await page.locator('.edge-label').evaluateAll(ns=>ns.map(n=>({text:n.textContent,members:n.dataset.relations.split(' ').length})));
                  assert.deepEqual(labels.filter(x=>x.text==='認証済み作業者の識別情報').map(x=>x.members),[5]);
                  assert.deepEqual(labels.filter(x=>x.text==='従業員の識別情報 / 役職 / 役職ごとの決裁単位の上限額').map(x=>x.members),[2]);
                }
                if(await page.locator('#check-followup').isVisible())await page.locator('#check-followup-later').click();
                const pkg=kind==='states'?purchase:kind==='checks'?checks:business,bd=pkg.documents.find(d=>d.kind==='businessDesign');
                const object=kind==='states'?bd.objects.find(o=>o.name==='購入申請'):undefined;
                const activity=kind==='checks'?bd.activities.find(a=>a.id===pkg.documents.find(d=>d.kind==='checkItems').index[0].activityId):bd.activities[0];
                const selected=object??activity,id=kind==='md'?selected.name:selected.id;
                if(!await page.locator('#node-list-drawer').isVisible())await page.locator('#node-list-toggle').click();
                await page.locator(object?'#node-category-object':'#node-category-activity').click();
                await page.locator('[data-list-node="'+id+'"] .node-navigate').click();
                await page.locator('#node-list-close').click();
                if(!await page.locator('#formattedMarkdownDrawer').isVisible())await page.locator('#drawer').click();
                assert.equal(await page.locator('#detail h1').innerText(),selected.name);
                if(kind==='states'){await page.locator('#detail-mode-states').click();await page.locator('.state-diagram').waitFor();assert.equal(await page.locator('[data-transition]').count(),13);}
                else if(kind==='checks'){await page.locator('#detail-mode-checks').click();assert.ok(await page.locator('.check-item').count()>0);assert.ok((await page.locator('#detail').innerText()).includes('未確認'));}
                else{assert.ok((await page.locator('.json-detail').innerText()).includes('Procedure'));assert.ok((await page.locator('.json-detail').innerText()).includes(activity.procedure.split('\n')[0].replace(/^\d+\.\s*/,'').replace(/\*\*|`/g,'').slice(0,36)));}
                assert.deepEqual(errors,[]);
                assert.ok(requests.every(x=>x.method==='GET'));
                assert.ok(requests.some(x=>x.url.startsWith('https://raw.githubusercontent.com/mk3008/alder/'+process.env.SOURCE_SHA+'/')),'source commit fixed');
                await page.screenshot({path:'preview-evidence/'+kind+'-'+width+'.png'});
                results.push({kind,width,nodes,edges,selected:selected.name,view:kind==='states'?'states':kind==='checks'?'checks':'common-business-detail',pageErrors:errors,requests:requests.length});
              }finally{await context.close();}
            }
            console.log(JSON.stringify({previewSmoke:'passed',source:process.env.SOURCE_SHA,results}));
          }finally{await browser.close();}
          JS
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr285-browser/node_modules/playwright" node "$RUNNER_TEMP/pr285-smoke.mjs"
      - name: Preserve preview smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr285-loader-preview-smoke
          path: preview-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish only isolated preview path
        run: |
          set -euo pipefail
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add -- "preview/pr-285/$SOURCE_SHA"
          test -n "$(git -C pages diff --cached --name-only)"
          git -C pages commit -m "Publish isolated PR 285 Viewer review preview from $SOURCE_SHA"
          git -C pages push origin HEAD:gh-pages-web-viewer
          echo "Preview: https://mk3008.github.io/alder/preview/pr-285/$SOURCE_SHA/open-purchase.html" >> "$GITHUB_STEP_SUMMARY"
