name: Build isolated PR 357 review preview
on:
  push:
    branches:
      - beta/pr-357-preview-6a363cd9
    paths:
      - .github/workflows/build-pr357-review.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: 6a363cd9febd222130a804085d3bf910c57d2591
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = 6a363cd9febd222130a804085d3bf910c57d2591
          test "$(git rev-parse 'HEAD^{tree}')" = f621c87ec8121a68a829cb07d14c4e3e38c1b67f
          git diff --quiet HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:structure-explorer
      - run: npm run test:normalization-candidate
      - run: npm run test:complete-concept-review
      - run: npm run build
      - name: Package pinned public review JSON
        run: |
          mkdir -p dist/examples
          cp ../business-design/alder/json-complete-concept-review.json dist/examples/json-complete-concept-review.json
          echo 'd340564a5ed0d347d7c07934dc2f0bf81eae41a1f473369245187541e16e0d87  dist/examples/json-complete-concept-review.json' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist')
          files={str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(root.rglob('*')) if path.is_file()}
          assert 'index.html' in files and 'concept.html' in files
          assert 'examples/json-complete-concept-review.json' in files
          manifest={'source':'6a363cd9febd222130a804085d3bf910c57d2591','sourceTree':'f621c87ec8121a68a829cb07d14c4e3e38c1b67f','files':files}
          (root/'preview-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pr357-fixed-preview-6a363cd9
          path: web-viewer/dist
          if-no-files-found: error
          retention-days: 14
