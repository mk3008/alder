name: Build isolated PR 357 review preview
on:
  push:
    branches:
      - beta/pr-357-preview-32427915
    paths:
      - .github/workflows/build-pr357-review.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: 32427915afa4cf6a2c4eb72fbd76541ae94d048e
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = 32427915afa4cf6a2c4eb72fbd76541ae94d048e
          test "$(git rev-parse 'HEAD^{tree}')" = 96d7eeb151f3d704f5ac08816bfcc312b2b04b7d
          git diff --quiet HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:structure-explorer
      - run: npm run test:normalization-candidate
      - run: npm run build
      - name: Package pinned public review JSON
        run: |
          mkdir -p dist/examples
          cp ../business-design/alder/json-normalized-model-review.json dist/examples/json-normalized-model-review.json
          echo '708023cc112e137f66d295213b50dd8c67e52737b3e0fdd02ca0718aef93ab36  dist/examples/json-normalized-model-review.json' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist')
          files={str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(root.rglob('*')) if path.is_file()}
          assert 'index.html' in files and 'concept.html' in files
          assert 'examples/json-normalized-model-review.json' in files
          manifest={'source':'32427915afa4cf6a2c4eb72fbd76541ae94d048e','sourceTree':'96d7eeb151f3d704f5ac08816bfcc312b2b04b7d','files':files}
          (root/'preview-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pr357-fixed-preview-32427915
          path: web-viewer/dist
          if-no-files-found: error
          retention-days: 14
