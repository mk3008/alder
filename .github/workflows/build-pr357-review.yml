name: Build isolated PR 357 review preview
on:
  push:
    branches:
      - beta/pr-357-preview-17d38fc1
    paths:
      - .github/workflows/build-pr357-review.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: 17d38fc13d7bee97182f244d382bd96e785ae942
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = 17d38fc13d7bee97182f244d382bd96e785ae942
          test "$(git rev-parse 'HEAD^{tree}')" = cafcc30b629704af4c7ac06910e9a5408344dde3
          git diff --quiet HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:structure-explorer
      - run: npm run test:normalization-candidate
      - run: npm run build
      - name: Package pinned public review JSON
        run: |
          mkdir -p dist/examples
          cp ../business-design/alder/json-normalized-model-review.json dist/examples/json-normalized-model-review.json
          echo 'e6130d9d2cae5644d62c66fcfa1f9902f82445c46635c3fb30130f7f8f1460c5  dist/examples/json-normalized-model-review.json' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist')
          files={str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(root.rglob('*')) if path.is_file()}
          assert 'index.html' in files and 'concept.html' in files
          assert 'examples/json-normalized-model-review.json' in files
          manifest={'source':'17d38fc13d7bee97182f244d382bd96e785ae942','sourceTree':'cafcc30b629704af4c7ac06910e9a5408344dde3','files':files}
          (root/'preview-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pr357-fixed-preview-17d38fc1
          path: web-viewer/dist
          if-no-files-found: error
          retention-days: 14
