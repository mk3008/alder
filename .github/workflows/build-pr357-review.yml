name: Build isolated PR 357 review preview
on:
  push:
    branches:
      - beta/pr-357-preview-fe39923b
    paths:
      - .github/workflows/build-pr357-review.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: fe39923b275db942ed4001e4fc67e827a4e96f14
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = fe39923b275db942ed4001e4fc67e827a4e96f14
          test "$(git rev-parse 'HEAD^{tree}')" = 87ed9244a8663b91ee5033478946e0af84fc23aa
          git diff --quiet HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:structure-explorer
      - run: npm run test:normalization-candidate
      - run: npm run build
      - name: Package pinned public review JSON
        run: |
          mkdir -p dist/examples
          cp ../business-design/alder/json-normalized-model-review.json dist/examples/json-normalized-model-review.json
          echo 'b8e636e26c21dae8b4214b929a6822550a1c63cc6d502f65933f13925142bd1e  dist/examples/json-normalized-model-review.json' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dist')
          files={str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(root.rglob('*')) if path.is_file()}
          assert 'index.html' in files and 'concept.html' in files
          assert 'examples/json-normalized-model-review.json' in files
          manifest={'source':'fe39923b275db942ed4001e4fc67e827a4e96f14','sourceTree':'87ed9244a8663b91ee5033478946e0af84fc23aa','files':files}
          (root/'preview-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pr357-fixed-preview-fe39923b
          path: web-viewer/dist
          if-no-files-found: error
          retention-days: 14
