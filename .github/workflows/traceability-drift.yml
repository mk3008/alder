name: Traceability drift PoC

on:
  pull_request:
    paths:
      - 'work/traceability-drift/**'
      - 'docs/traceability-drift/**'
      - '.github/workflows/traceability-drift.yml'
  push:
    branches: [main]
    paths:
      - 'work/traceability-drift/**'
      - 'docs/traceability-drift/**'
      - '.github/workflows/traceability-drift.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detector boundary regressions
        run: python3 -m unittest discover -s work/traceability-drift -p 'test_drift.py' -v
      - name: Reproduce drift and maintenance scenarios
        run: python3 work/traceability-drift/evaluate.py --output "$RUNNER_TEMP/alder-drift-observations.json"
