name: Plugin package
on:
  pull_request:
    paths:
      - '.agents/plugins/**'
      - 'plugins/alder/**'
      - 'docs/phase2/review-knowledge-v0.3.md'
      - 'tools/test_plugin_package.py'
      - '.github/workflows/plugin-package.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/**'
      - 'plugins/alder/**'
      - 'docs/phase2/review-knowledge-v0.3.md'
      - 'tools/test_plugin_package.py'
      - '.github/workflows/plugin-package.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest tools/test_plugin_package.py
