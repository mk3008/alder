name: Plugin package
on:
  pull_request:
    paths:
      - 'LICENSE'
      - '.agents/plugins/**'
      - 'plugins/alder/**'
      - 'docs/phase2/review-knowledge-v0.3.md'
      - 'docs/adoption.md'
      - 'docs/business-graph.md'
      - 'docs/optimization-review.md'
      - 'tools/test_plugin_package.py'
      - 'tools/test_plugin_references.py'
      - 'tools/export_plugin_references.py'
      - 'tools/test_export_plugin_references.py'
      - 'tools/fetch_plugin_sources.py'
      - 'tools/test_fetch_plugin_sources.py'
      - 'docs/business-design-structure.ja.md'
      - 'tools/test_workflow_skills.py'
      - 'tools/check_activity_names.py'
      - 'tools/fixtures/plugin-draft-review-loop/**'
      - 'tools/test_plugin_release_workflow.py'
      - 'tools/validate_release.py'
      - 'tools/business_graph/export.py'
      - 'work/traceability-drift/drift.py'
      - 'work/traceability-drift/README.md'
      - 'docs/check-item-traceability.md'
      - 'docs/behavior-derivation/candidate-c3.md'
      - 'docs/behavior-derivation/functional-considerations.md'
      - 'docs/functional-interface/prompt.md'
      - 'docs/traceability-drift/study.md'
      - '.github/workflows/plugin-package.yml'
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - '.agents/plugins/**'
      - 'plugins/alder/**'
      - 'docs/phase2/review-knowledge-v0.3.md'
      - 'docs/adoption.md'
      - 'docs/business-graph.md'
      - 'docs/optimization-review.md'
      - 'tools/test_plugin_package.py'
      - 'tools/test_plugin_references.py'
      - 'tools/export_plugin_references.py'
      - 'tools/test_export_plugin_references.py'
      - 'tools/fetch_plugin_sources.py'
      - 'tools/test_fetch_plugin_sources.py'
      - 'docs/business-design-structure.ja.md'
      - 'tools/test_workflow_skills.py'
      - 'tools/check_activity_names.py'
      - 'tools/fixtures/plugin-draft-review-loop/**'
      - 'tools/test_plugin_release_workflow.py'
      - 'tools/validate_release.py'
      - 'tools/business_graph/export.py'
      - 'work/traceability-drift/drift.py'
      - 'work/traceability-drift/README.md'
      - 'docs/check-item-traceability.md'
      - 'docs/behavior-derivation/candidate-c3.md'
      - 'docs/behavior-derivation/functional-considerations.md'
      - 'docs/functional-interface/prompt.md'
      - 'docs/traceability-drift/study.md'
      - '.github/workflows/plugin-package.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact plugin provenance sources
        run: python3 tools/fetch_plugin_sources.py
      - name: Fetch pinned historical Check fixtures
        run: git fetch --no-tags origin c0020d3f88fa7ce70b17c197464978bb548f9100 d453b61be8520907bf7326ffbe429ca55feea9d8
      - run: python3 -m unittest tools/test_plugin_package.py tools/test_workflow_skills.py tools/test_plugin_release_workflow.py tools/test_export_plugin_references.py tools/test_plugin_references.py tools/test_fetch_plugin_sources.py
