<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowStep 作成ガイド</title><style>body{font:1rem/1.8 system-ui,sans-serif;max-width:48rem;margin:2rem auto;padding:0 1rem;color:#182738;background:#fff}li{margin:1rem 0}a{color:#175ca5}</style><main><h1>FlowStep 作成ガイド</h1><p>フロー内の手順を記述するときのルールです。</p><ul><li>入力誤りや人数不足など、バリデーションで検出する問題は、該当手順の例外に記述する。</li><li>検査を通過した後の処理は、通常の流れに記述する。</li><li>対象がなければ何もしないだけの場合は、独立した条件を設けず、手順に記述する。</li></ul><h2>元の記録</h2><p><a href="./examples/json-complete-concept-review.original.json">元JSON</a>の構造 <code>n-flow-step</code> と全体図のノード <code>overview-n-flow-step</code> にある説明に対応します。<a href="./display-copy-provenance.json">元の文章と表示文の対応</a>も確認できます。</p><p><a href="./?preview=1&view=concept&concept=structure-explorer%3An-flow-step#source=https%3A%2F%2Fmk3008.github.io%2Falder%2Fpreview%2Fpr-357%2F7ebe732f6ccc1676d591d564d95b711e473c60a3-main-review%2Fexamples%2Fjson-complete-concept-review.json">構造の説明に戻る</a></p></main></html>
