      "title": "備品購入申請 — 業務設計",
      "preface": "草案（採用した改善方針を反映した変更後の業務案。全体の人間レビュー・合意前）。\n\n社内で使用する備品の購入申請、承認、購入準備、調達不能時の調整、分割入庫と申請全体の終結の記録を記述する。実際の仕入れ・発注・在庫確認はシステムのスコープ外で行う。調整の相談手段や合意をシステムへどこまで記録するかは未決である。\n\n業務上の意味・前提・入力・手順・結果を記述し、画面部品、API、クラス、モジュール、データアクセス方法などの実装方式は規定しない。\n\n## 業務上のロール\n\n- **申請者** — 業務に必要な備品の購入を申請する。\n- **承認者** — 申請内容を確認し、購入を承認するか、申請者へ差し戻す。\n- **購買担当者** — 承認済み申請の購入準備を確定してCSVを出力し、外部で見積書を取得し、調達不能なら申請者と購入しない数量を調整し、分割入庫の実績と申請全体の終結を記録する。\n- **総務** — 基幹システムの役職別上限額に関する情報を管理する。\n- **人事** — 基幹システムの従業員情報を保守する。\n\nロールは業務上の責任と権限を表す。\n\n## 作業者の識別と認証\n\n各業務の作業者は、外部の認証基盤を利用したシングルサインオン（SSO）でログインし、一意に特定する。認証済みセッションは複数の画面・操作で継続利用する。パスワード等の資格情報を各業務へ配布する意味ではない。具体的な製品・サービス名は指定しない。\n\n各業務はスコープ外のObject「認証基盤」から認証済み作業者の識別情報を受け取る。申請時・再申請時には、その利用者に対応する従業員情報・役職を基幹システムから参照する。認証基盤と基幹システムの具体的な属性・キーの対応付けは、SR・実装側で具体化する。\n\n作業者と申請者が異なる代理申請を認めるか、その場合に誰の役職で判定するかは別の業務上の未決事項である。作業者を一意に識別できることから、代理申請の可否は推定しない。\n\n認証・セッション管理は一般的なWebアプリのセキュリティ要件に沿うものとする。具体的な技術条件はシステム要件（SR）で定める。認証プロトコルやセッションの有効期限等の詳細は未定である。\n\n## 購入申請の扱い\n\n購入申請は、申請者が業務上必要とする備品の購入要求を、承認および購買の対象として扱うための記録である。\n\n購入申請は、後述のObject 購入申請のInformationに挙げる情報を少なくとも持つ。\n\n購入申請は一意に識別できるものとする。識別子の採番・入力方法はこの業務設計では規定しない。\n\n一つの購入申請には複数の品目を含められる。各品目の希望金額は税抜希望単価×数量で算出し、申請全体の税抜合計額を申請者の役職別決裁上限額と比較する。\n\n提出して確定した内容を直接変更しない。差戻し・再申請では、何をいつ確定したか識別できる別の提出版を用いる方向とする。版の識別方法や下書きとの関係はレビュー中の設計候補である。\n\n## 業務相関\n\n1. 購買担当者がシステム外で見積書を取得して依頼部署へ返す。依頼部署は見積条件で経費を使うか判断する。見積取得機能は本システムに設けない。\n2. 申請者は依頼全体の見積書を添え、複数品目の品名・税抜単価・数量と購入理由を提出する。全品目の税抜小計の合計が役職別上限以下と自動判定できた場合だけ申請が成立する。見積書なし、権限不適合・判定不能では成立しない。下書きは必須値が未入力でも保存できる。今回は見積条件どおりの価格を前提とし、権限に収まらなければ別の人が申請するか見積内容を変える。代理操作の許可を意味しない。\n3. 承認者は申請内容を判断し、承認または差戻しを行う。承認後も購入準備確定前は差戻し可、準備確定後は不可。確定提出版を直接変更せず、再申請で別の確定版を区別する。旧承認判断の業務履歴は不要だが、古い判断を現在の購買根拠として使わない。\n4. 購買担当者は複数の承認済み申請を申請単位で一つの準備番号へまとめる。一申請を品目別に別準備へ分割しない。番号・対象・差戻し不可を一貫して確定する。CSV失敗・紛失でも同じ番号・同じ凍結内容で再出力する。書き出し日は分かるが発注日ではなく、出力で購入完了にはしない。\n5. CSV書き出し後の発注管理は購買側システムが行う。本システムで発注日を管理せず、発注情報の追加受信を前提にしない。\n6. 倉庫への分割納品を扱い、購買担当者が各回の入庫結果を登録する。代替品は今回禁止する。調達不能時は購買担当者と申請者で購入しない数量を調整し、元の承認者は介入しない。元の提出内容・準備内容を上書きしない。\n7. 全依頼数量を品目ごとに入庫済み・今後購入しないと確定・未入庫待ちに区別する。待ちが残れば作業中とし、全数量の結末がそろったら申請全体を一度だけ終結する。全数入庫、一部入庫と残り購入なし、全数購入なしの3つを区別する。最終終結の訂正は扱わない。分割納品を別発注による分割購入の許可と解釈しない。\n8. 下書き・差戻しから再申請または破棄を選べる。再申請にも見積書必須と税抜合計の権限判定を適用する。\n\n## 調達不能時の調整\n\n依頼10個に対して5個入庫・5個待ちなら作業中、5個入庫・残り5個を購入しないと確定すれば終了する。8個入庫・2個待ちを完了にしない。代替品は購入しない。全数を購入しないと決めた場合は入庫実績0件でも終結できる。数量減・購入なしの調整に元の承認者は介入しない。調整理由・合意者などの保存範囲は未決である。\n\n## 現在の業務設計で未決定の事項\n\n次の事項は現在の業務設計では定めない。\n\n- 申請金額によって承認者や承認段階が変わる場合の扱い\n- 見積取得、在庫確認、実発注・発注日の管理、検収、支払、倉庫内の在庫・払出管理（分割納品の入庫結果登録は対象）\n- 購入先の選定方法\n- 購入後の備品管理、資産管理、廃棄\n- 基幹システムからの従業員情報・役職別上限額の参照、外部認証基盤によるSSO、購入用CSVの出力以外の外部システム連携\n- 監査履歴や通知に関する業務\n- 役職別上限額の具体的な値、基幹システムを参照する際の運用条件\n- CSVに含める列・出力形式・配布管理・再出力の担当と履歴、最終調達結果の入力方式（手入力・CSV取込等）。ただし購入準備番号と同番号での再出力は合意済み\n- 調達不能時の申請者との合意確認・記録範囲。数量減・購入なしの調整に元承認者は介入せず、代替品は禁止とする\n- 数量・金額の数値範囲、端数、最終的な実購入金額の税区分\n- 一括却下・一括結果登録の採用（今回の改善では採用していない）\n\nこれらは、現在の業務設計を実装するために決定済みであるとはみなさない。\n\n## 確認が必要な事項（未確認）\n\n承認と差戻しの業務境界はF01、購入準備と購入結果登録の分離はF02、認証基盤からの作業者識別情報の受取りはF03に解消内容を記録する。代理申請の可否・適用する役職は、F03とは別の業務上の未決事項として残す。\n\n- **購入できない場合・結果登録できない場合**：購入しない数量を申請者と調整し、入庫済み数量と区別する。合意記録の粒度は未決。技術的な失敗時の重複防止と安全な再試行は設計・実装で保証する。購入日時・入庫日・登録日時を同一と定めない。\n- **入力不足・状態が変わった場合**：提出には見積書と品目情報が必要で、権限判定不能なら成立しない。下書きは未入力可。承認・差戻し・準備確定は処理時にも状態を再確認し、差戻しと準備の同時成功を認めない。数量・金額の具体的な範囲・精度は未決。\n\n基幹システムの役職別上限額に不適合または判定不能の場合の申請不成立と、承認業務中の差戻し、差戻し・下書きからの再申請または破棄は後述のとおりとする。それ以外の未記載の操作結果は未決である。\n\n- **破棄・再申請不成立の扱い**：申請中断時の下書き保存と、その下書きからの再開は後述のとおりとする。破棄時の物理削除・履歴保持、再申請が権限判定で成立しなかった後の元の申請内容の扱いは未確認である。下書きの自動保存や、破棄後の保存期間は規定しない。\n\n## 参照する基幹システム\n\n基幹システムは、従業員の識別情報・役職と、役職ごとの決裁単位の上限額を提供する外部システムである。決裁単位は購入申請1件とし、申請者の役職に対応する上限額を用いる。従業員情報は人事、役職別上限額に関する情報は総務が管理する。\n\n今回の業務は基幹システムから必要な情報を参照し、その保守は扱わない。内部のテーブル単位にはObjectを分けない。具体的な上限額や参照時の運用条件は未確認である。認証済み利用者と従業員情報の具体的なキー対応はSR・実装側で定める。",
      "scope": "社内の備品購入について、基幹システムの役職別上限額に基づく申請可否の自動判定、申請と中断時の下書き保存、承認と購入準備前の差戻し、下書き・差戻しからの再申請または破棄、承認済み申請の購入準備番号の確定と購入用CSV出力・再出力、調達不能時の申請者との調整に基づく最終クローズ、および最終結果の登録を扱う。見積取得、実際の購入・在庫確認・発注管理・発注日・交渉手段はシステムのスコープ外とする。代替品の購入は禁止し、倉庫への各回の入庫結果登録と全数量の終結は対象とする。交渉後の合意記録とシステムでの結果確定の境界は人間レビュー前の草案である。購入申請はこの業務で成立・更新する記録である。申請者・承認者・購買担当者のObjectは、各業務で情報を入力・選択する人を表し、人自体を成立・管理する業務は扱わない。基幹システムは従業員情報・役職別上限額を提供するスコープ外のObjectであり、内部のテーブル構造や同システムの保守は今回の業務に含めない。認証基盤もスコープ外のObjectとして利用し、認証済み作業者の識別情報を受け取る。利用者登録・認証基盤の管理、独立したログイン業務は今回扱わない。前述の対象外業務や未採用の一括却下・一括結果登録は含めず、未確認の条件を決定済みとはみなさない。",

          "why": "購入の必要性と希望内容を記録し、承認者が購入可否を判断できる状態にするため。",
          "when": "申請者が、業務上必要な備品を購入したいと判断したとき。",
          "who": "申請者",
          "where": "規定なし。",
          "procedure": "業務に必要な備品の購入要求を、購入申請として登録する。認証基盤から受け取る認証済み作業者の識別情報で作業者を一意に特定する。代理申請の範囲は、前述の未決事項に従う。\n\n1. 申請者が必要な品目ごとの品名・税抜希望単価・数量と購入理由を入力し、外部取得済みの依頼全体の見積書を添付する。1申請で複数品目を指定できる。見積なしでは提出を成立させない。\n2. 各品目の税抜小計を税抜希望単価×数量で算出し、全品目の小計を合計して申請の税抜希望合計金額を求める。\n3. 申請者に対応する基幹システムの情報から、申請者の役職を確認する。\n4. 申請全体の税抜希望合計金額が、その役職に対応する基幹システムの役職別上限額以下であるか、自動判定する。\n5. 適合すると判定できた申請を、新しい購入申請として登録する。\n6. 新規Object「購入申請」を状態「申請済み」で保存する（作成前 → 申請済み）。",
          "exception": "- **権限判定不成立** — 基幹システムの役職別上限額に適合しない場合、または規定の矛盾・必要情報の不足などで適合すると判定できない場合は、申請を成立させず、`申請済み` の購入申請を作成しない。この申請不成立を、承認業務による差戻しとは扱わない。\n\n- **作業中断** — 申請者が提出前に申請業務を中断し、下書き保存を選んだ場合は、申請者と入力途中の内容を購入申請へ「下書き」の状態で新規保存する（作成前 → 下書き）。提出時の必須項目が未入力でも下書き保存できる。下書き保存では `申請済み` の成立や権限判定の通過を意味せず、承認・購入の対象にしない。保存した下書きは「購入申請を再申請・破棄する」で再開し、内容を整えて提出するか、破棄するかを選べる。",
          "result": "- 基幹システムの役職別上限額への適合を自動判定で確認した購入要求が、`申請済み` の購入申請として記録される。\n- 申請者、申請品目ごとの税抜希望単価・数量、申請全体の税抜希望合計、購入理由、申請日時が保持される。\n- 承認者が購入可否を判断できる状態になる。",
          "problem": null,
          "painLevel": null
        },
        {
          "id": "388d197d-2db8-4f72-9125-767dca0873e0",
          "name": "購入申請を承認する",
          "scope": true,
          "why": "申請内容が妥当であることを確認し、購買担当者が購入を進められる状態にするため。",
          "when": "購入申請が `申請済み` として提出されたとき。または、承認済みの申請について、**購入準備がまだ確定していない**段階で承認者が差戻しを判断したとき。",
          "who": "承認者",
          "where": "規定なし。",
          "procedure": "認証基盤から受け取る認証済み作業者の識別情報で、承認業務の作業者を一意に特定する。提出された購入申請の購入可否は、承認者が業務中に人間として判断し、その責任を負う。以下は承認する場合の正常手順である。\n\n1. 承認者が、対象となる `申請済み` の購入申請を選択し、その内容を確認する。\n2. 購入してよいと判断する。\n3. 対象Object「購入申請」の状態を「申請済み」から「承認済み」へ変更する。\n4. 承認日時を記録する。",
          "exception": "- **差戻し** — 承認者が業務中に購入を認めないと判断した場合は、対象購入申請を `申請済み` から `差戻し` へ変更し、差戻し理由・日時を記録して申請者に再申請・破棄の選択を戻す。この場合は承認を成立させない。\n- **承認後差戻し** — すでに `承認済み` でも**購入準備番号が未確定**なら承認者は判断を変更して `差戻し` にできる。以前の承認を現在有効な購買根拠から外し、再申請・破棄の業務へ戻す。過去の承認判断の業務履歴は必須としない。購入準備確定後の差戻しや、同時に両操作を成立させることは認めない。",
          "result": "- 対象購入申請が `承認済み` になる。\n- 承認日時が記録される。\n- 購買担当者が購入対象として扱える状態になる。",
          "problem": null,
          "painLevel": null
        },
        {
          "id": "5c55195f-a56f-4032-a625-fd098276a307",
          "name": "購入申請を再申請・破棄する",
          "scope": true,
          "why": "下書きや差し戻された購入申請を、再び承認に進めるか、不要な申請内容を破棄するか確定するため。",
          "when": "申請者が、保存済みの下書きの購入申請から作業を再開するとき。",
          "who": "申請者",
          "where": "規定なし。",
          "procedure": "認証基盤から受け取る認証済み作業者の識別情報で作業者を一意に特定する。申請者は対象の申請内容について再申請または破棄を選ぶ。代理申請の範囲は前述の未決事項に従う。以下は再申請する場合の正常手順である。\n\n1. 下書きまたは差し戻された対象購入申請の内容を確認する。差し戻された場合は、その理由も確認する。\n2. 再申請する複数の品目（品名・税抜希望単価・数量）と購入理由を入力し、依頼全体の見積書を確認・添付する。見積なしでは再申請を成立させない。各品目小計の合計を求める。\n3. 基幹システムから申請者の役職を確認し、申請全体の税抜希望合計金額が役職別上限額以下であるか自動判定する。\n4. 適合すると判定できた内容を、従前の確定内容を変更せず新たな提出版として確定し、対象Object「購入申請」を再申請する。状態を「下書き」または「差戻し」から「申請済み」へ変更し、申請日時を記録する。",
          "exception": "- **申請内容の破棄** — 再申請せず破棄することを選んだ場合は、対象の申請内容を破棄する。破棄した内容を以後の承認・購入の対象にしない。対象Objectは「購入申請」、変更前は「下書き」または「差戻し」。処理後の保存状態は未決である。\n- **再申請不成立** — 基幹システムの役職別上限額に適合しない場合、または必要情報の不足や矛盾等で判定できない場合は、再申請を成立させず、`申請済み` の状態へ変更しない。その後の元の申請内容の扱いは未確認である。過去に確定した提出版を直接編集しない。",
          "result": "- 対象購入申請が権限判定を通った内容で `申請済み` として再申請され、承認者が再び可否を判断できる。",
          "problem": null,
          "painLevel": null
        },
        {
          "id": "86b312da-10ad-4d7e-bd3f-6389a4d8666c",
          "name": "購入を準備する",
          "scope": true,
          "why": "承認済みの購入要求を複数まとめ、後から同一内容を再出力できる購入準備として確定し、システム外の購入作業へ渡すため。",
          "when": "購入申請が `承認済み` で、まだ購入準備番号を確定していないとき。",
          "who": "購買担当者",
          "where": "規定なし。",
          "procedure": "1. 認証済み作業者を一意に特定する。\n2. 購買担当者が承認済みの購入申請を選択する。一つの申請の品目を別々の準備へ分割しない。\n3. その購入準備に一つの購入準備番号を発行し、選択した申請を同じ番号に紐づける。番号と対象の確定後は承認者の差戻しを認めない。差戻し操作と準備確定が競合したら、両方の成功を許さない。\n4. 確定した購入準備番号と同じ申請内容を使って購入用CSVを出力し、システム外の購買へ渡す。出力完了だけでは購入済みにしない。",
          "exception": "- **CSV再出力** — CSVの生成失敗または紛失があった場合、購入準備番号と対象を取り消さず、**同じ番号・同じ確定内容**で再出力する。通常の失敗時の安全な再試行や二重処理防止は設計・実装で保証する。\n- **購入準備競合** — 対象申請が同時に差し戻された、またはすでに別の準備に組み込まれた場合は、重複した準備確定を成立させない。具体的な通知とやり直し操作は未決。",
          "result": "購入準備番号と対象が確定し、承認者の差戻しができない。CSVの成否と区別して購入準備の確定を保持し、失敗時も同じ準備を再出力できる。",
          "problem": null,
          "painLevel": null
        },
        {
          "id": "4f343ef6-c1e5-4ea3-8028-bbdd158181a0",
          "name": "購入結果を登録する",
          "scope": true,
          "why": "分割納品の各回の入庫結果と購入しない数量を記録し、全依頼数量の結末がそろった申請を終結するため。",
          "when": "購入準備済みの申請について倉庫への入庫があったとき、または購買担当者と申請者が今後購入しない数量を確定したとき。",
          "who": "購買担当者",
          "where": "規定なし。",
          "procedure": "1. 認証済み作業者を一意に特定し、準備済みで未終結の対象申請と、変更不能の提出内容を確認する。\n2. 各回の入庫結果を元の申請品目へ対応させて登録する。分割納品では複数回登録できる。代替品を登録せず、元の品名・数量・単価や準備内容を上書きしない。\n3. 調達できない残数は購買担当者と申請者で調整し、今後購入しない確定数量として入庫実績とは分けて記録する。元の承認者は介入しない。\n4. 各品目で「依頼数量＝入庫累計＋購入しない確定数量＋未入庫待ち」を確認する。過剰数量や別申請・旧版の品目への登録を成立させない。\n5. いずれかの品目に待ちが残れば作業中を維持する。すべての品目の待ちが0なら申請全体を一度だけ終結し、全数入庫／一部入庫と残り購入なし／全数購入なしを区別する。終結後の訂正は扱わない。",
          "exception": "- **調達不能・購入断念** — 申請者との調整で、残数量または全数量を購入しないと確定する。入庫0件でも終結できる。承認拒否や再申請への差戻しとは扱わない。",
          "result": "各回の入庫と今後購入しない数量が元の確定品目に対応して記録される。待ちが残る申請は作業中となり、全数量の結末が確定した申請のみ終結する。失敗後の再送で実績を重複させず、二重の最終結果を作らない。",
          "problem": null,
          "painLevel": null
        }
      ],

          "content": "旧版では承認・却下のWhenが可否判断後である一方、Procedureは内容確認から始まり、開始条件と判断の範囲が整合していなかった。\n\n人間の判断に基づき、申請済みの購入申請の提出を入口として承認業務を開始し、可否はその業務中に承認者が判断する。独立していた却下Activityは承認業務へ統合した。追加の人間判断に基づき、購入を認めない場合はHowのExceptionで申請者へ差し戻し、「購入申請を再申請・破棄する」のException Whenへつなぐ。申請者は差戻し・下書きから再申請または破棄を選べる。承認の正常結果承認済みと、再申請前の差戻しを区別する。"

          "content": "旧Activityは購入前の確認と実購入・結果登録を含む一方、Inputが購入後の情報を前提としていた。\n\n人間の判断に基づき、「購入を準備する」で承認済み購入申請を購入用CSVへ出力し、実際の購入作業をシステム外とした。追加ヒアリングを反映し、「購入結果を登録する」で分割納品の各回の入庫実績と購入しない確定数量を記録する。待ちが残れば作業中とし、全品目の結末がそろった場合だけ申請を終結する。購買側で承認を拒否することと、申請者と調整して残数量を購入しないことは区別する。代替品は禁止。CSV出力だけで購入完了にはしない。入庫日・実績金額の詳細やCSV形式、調整の合意記録範囲は未決として残す。"

          "summary": "認証基盤から認証済み利用者の識別情報を受け取り、作業者を一意に特定する",
          "content": "人間の判断に基づき、外部の認証基盤によるSSOで作業者を一意に特定し、認証済みセッションを複数の画面・操作で継続利用する。スコープ外のObject「認証基盤」を置き、各ActivityのInputに認証済み作業者の識別情報を明記した。申請時・再申請時には、その利用者に対応する従業員情報・役職を参照する。\n\n具体的な製品名、認証プロトコル、Windowsログインとの連携方法、認証基盤と基幹システムの属性・キーの対応付け、セッション管理の技術条件はSR・実装側で具体化する。ID・パスワードの登録や入力を必須の業務手順にせず、独立したログインActivityも追加しない。\n\nこれにより作業者の識別情報の出所と利用方針を確定し、F03を解消する。代理申請の可否・その場合に誰の役職を使うかは、別の業務上の未決事項として前書きに保持する。申請者に対応する従業員情報や役職を確認できず判定不能となる場合は、既決のとおり申請不可とする。"

      "id": "b2e72de1-2a94-4c07-9fc8-83e151a89363",

      "revision": "9b4a3cbffe835cfa9c6a8ec7d602d9611a1a0285",
      "title": "備品購入申請 — 業務設計",
      "preface": "社内で使用する備品の購入申請から購入完了までに必要となる業務を記述する。\n\n業務上の意味・前提・入力・手順・結果を記述し、画面部品、API、クラス、モジュール、データアクセス方法などの実装方式は規定しない。\n\n## 業務上のロール\n\n- **申請者** — 業務に必要な備品の購入を申請する。\n- **承認者** — 申請内容を確認し、購入を承認または却下する。\n- **購買担当者** — 承認済みの申請に基づいて購入を行い、購入結果を登録する。\n\nロールは業務上の責任と権限を表す。\n\n## 購入申請の扱い\n\n購入申請は、申請者が業務上必要とする備品の購入要求を、承認および購買の対象として扱うための記録である。\n\n購入申請は、後述のObject 購入申請のInformationに挙げる情報を少なくとも持つ。\n\n購入申請は一意に識別できるものとする。識別子の採番・入力方法はこの業務設計では規定しない。\n\n## 業務相関\n\n現在定義している主な業務相関は次のとおりである。\n\n1. 備品購入を申請すると、`submitted` の購入申請が成立する。\n2. `submitted` の購入申請を承認すると、`approved` になる。\n3. `submitted` の購入申請を却下すると、`rejected` になる。\n4. `approved` の購入申請に基づいて購入すると、`purchased` になる。\n5. `rejected` の購入申請は購買対象にならない。\n\n## 現在の業務設計で未決定の事項\n\n次の事項は現在の業務設計では定めない。\n\n- 申請金額によって承認者や承認段階が変わる場合の扱い\n- 在庫確認、発注、納品、検収、支払に関する業務\n- 購入先の選定方法\n- 購入後の備品管理、資産管理、廃棄\n- 外部システムとの連携\n- 監査履歴や通知に関する業務\n\nこれらは、現在の業務設計を実装するために決定済みであるとはみなさない。",
      "scope": "社内の備品購入について、申請・承認・却下・購入と購入結果の登録を扱う。購入申請はこの業務で成立・更新する記録である。申請者・承認者・購買担当者のObjectは、各業務で情報を入力・選択する人を表し、人自体を成立・管理する業務は扱わない。前述の未決定事項は今回の対象に含めない。",

            },

          ]
        }
      ],
      "guarantees": [
        {
          "id": "14b958da-0353-469a-9182-af1b9eead2d7",
          "sectionId": "d8c9d1ac-bb23-42b2-9ba9-8b4aa547baaf",
          "title": "申請の条件・保証と例",
          "blocks": [
            {
              "kind": "prose",
              "content": [
                {
                  "kind": "text",
                  "value": "申請者が業務上必要な備品を購入したいと判断し、品名・数量・希望購入金額・購入理由を**すべて必須入力**として、新しい購入申請を登録する。入力の存在は必要条件であり、値の妥当性や、それだけで登録できる十分条件は定められていない。"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-01",
                  "label": "JA-EX-01"
                },
                {
                  "kind": "text",
                  "value": " の一般保証は、この登録で購入要求が `submitted` の購入申請として記録されることである。申請しただけで承認・却下が済むわけではない。\n\n次の値は結果の違いを読むための例示であり、数量や金額の許容範囲を定めない。いずれも申請者が新しい購入申請を登録する場面である。"
                }
              ]
            },
            {
              "kind": "example",
              "exampleId": "5f065791-d41e-4784-b9dc-5f0b5c405d1a"
            }
          ]
        },
        {
          "id": "f025ef5d-44fc-417a-933c-a3dc8226e141",
          "sectionId": "fde50bba-8598-4835-b9b8-95a8672fa679",
          "title": "承認の条件・保証と例",
          "blocks": [
            {
              "kind": "prose",
              "content": [
                {
                  "kind": "text",
                  "value": "承認者が `submitted` の購入申請について購入してよいと判断し、その対象を選択して承認する。"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-02",
                  "label": "JA-EX-02"
                },
                {
                  "kind": "text",
                  "value": " の一般保証は、**その対象購入申請**が `approved` になることである。承認した時点で購入を済ませたことにはならない。金額による承認者・承認段階の変更は"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-Q01",
                  "label": "JA-EX-Q01"
                },
                {
                  "kind": "text",
                  "value": "に残す。\n\n同じ申請A（品名「机」、数量2、希望購入金額20,000、購入理由「執務席用」）を対象として承認を行う場合を比べる。金額20,000は閾値を意味しない。"
                }
              ]
            },
            {
              "kind": "example",
              "exampleId": "4db939c4-c822-498f-ad49-6369b2016d2f"
            }
          ]
        },
        {
          "id": "6cf8dd1f-1d3b-487d-92fb-26c7ae079460",
          "sectionId": "801b2afe-947e-4206-9b65-ef1217fa9302",
          "title": "却下の条件・保証と例",
          "blocks": [
            {
              "kind": "prose",
              "content": [
                {
                  "kind": "text",
                  "value": "承認者が `submitted` の購入申請について購入を認めないと判断し、却下する対象購入申請と却下理由を**すべて必須入力**として却下する。"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-03",
                  "label": "JA-EX-03"
                },
                {
                  "kind": "text",
                  "value": " の一般保証は、対象購入申請が `rejected` になることである。別の独立した"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-04",
                  "label": "JA-EX-04"
                },
                {
                  "kind": "text",
                  "value": "の一般保証は、`rejected` である申請が購買担当者の購入対象にならないことであり、「承認済み備品を購入する」にも及ぶ。\n\n対象申請C（品名「椅子」、数量1、希望購入金額15,000、購入理由「破損した椅子の交換」）について、承認者が購入を認めず却下する場面を比べる。数値は許容範囲を示さない。"
                }
              ]
            },
            {
              "kind": "example",
              "exampleId": "5f1c30cf-2deb-4306-b2c6-7dcf50b40762"
            }
          ]
        },
        {
          "id": "1e1673bc-7afd-493b-948b-24634997a502",
          "sectionId": "887ed682-4bda-4e2f-bf1d-7a03416c7a09",
          "title": "購入の条件・保証と例",
          "blocks": [
            {
              "kind": "prose",
              "content": [
                {
                  "kind": "text",
                  "value": "購買担当者が `approved` の購入申請を確認し、それに基づいて対象備品を購入する。購入した対象購入申請の選択と実購入金額は**すべて必須入力**であり、購入結果を登録する。"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-05",
                  "label": "JA-EX-05"
                },
                {
                  "kind": "text",
                  "value": "の一般保証は、購入した**その対象申請**が `purchased` になることである。必須入力があるだけで購入・登録が成立する十分条件や、入力を欠くときの失敗応答は定められていない。\n\n購買担当者が対象の備品を購入し、結果を登録する例1・2と、却下済みの申請を購入対象として扱おうとする例3を比べる。申請Dは品名「机」、希望購入金額20,000、申請Cは品名「椅子」である。金額は例示であり、希望額との差額の扱いはここでは決めない。"
                }
              ]
            },
            {
              "kind": "example",
              "exampleId": "107bf4bc-4f96-45da-bac2-cf57fb42e2df"
            },
            {
              "kind": "prose",
              "content": [
                {
                  "kind": "text",
                  "value": "- 例1の希望購入金額20,000と実購入金額19,500は別の情報であり、別申請の状態は保証の対象でない。例2は必須の実購入金額を欠くため、購入後の扱いも決めない。\n- 例3の15,000は対象扱いを試みる場面の仮入力であり、購入実績ではない。値の有無は共有の"
                },
                {
                  "kind": "reference",
                  "targetId": "JA-EX-04",
                  "label": "JA-EX-04"
                },
                {
                  "kind": "text",
                  "value": "の除外保証を変えず、購入操作の失敗応答や状態遷移は定めない。"
                }
              ]
            }
          ]
        }
      ],

  "archives": [
    {
      "documentId": "e14f5f43-30c9-43bd-8a20-11a72c3b53e0",
      "revision": "6e55d98710a1d8757937ea268176929abcf49b2e",
      "sha256": "106dad5ff49dbd694609aa565f6d995a7205551ff8699aafad015354e5e3ff39",
      "mediaType": "text/markdown",
      "text": "# 備品購入申請 — 業務設計\n\n草案（採用した改善方針を反映した変更後の業務案。全体の人間レビュー・合意前）。\n\n社内で使用する備品の購入申請、承認、購入準備、調達不能時の調整、分割入庫と申請全体の終結の記録を記述する。実際の仕入れ・発注・在庫確認はシステムのスコープ外で行う。調整の相談手段や合意をシステムへどこまで記録するかは未決である。\n\n業務上の意味・前提・入力・手順・結果を記述し、画面部品、API、クラス、モジュール、データアクセス方法などの実装方式は規定しない。\n\n## 業務上のロール\n\n- **申請者** — 業務に必要な備品の購入を申請する。\n- **承認者** — 申請内容を確認し、購入を承認するか、申請者へ差し戻す。\n- **購買担当者** — 承認済み申請の購入準備を確定してCSVを出力し、外部で見積書を取得し、調達不能なら申請者と購入しない数量を調整し、分割入庫の実績と申請全体の終結を記録する。\n- **総務** — 基幹システムの役職別上限額に関する情報を管理する。\n- **人事** — 基幹システムの従業員情報を保守する。\n\nロールは業務上の責任と権限を表す。\n\n## 作業者の識別と認証\n\n各業務の作業者は、外部の認証基盤を利用したシングルサインオン（SSO）でログインし、一意に特定する。認証済みセッションは複数の画面・操作で継続利用する。パスワード等の資格情報を各業務へ配布する意味ではない。具体的な製品・サービス名は指定しない。\n\n各業務はスコープ外のObject「認証基盤」から認証済み作業者の識別情報を受け取る。申請時・再申請時には、その利用者に対応する従業員情報・役職を基幹システムから参照する。認証基盤と基幹システムの具体的な属性・キーの対応付けは、SR・実装側で具体化する。\n\n作業者と申請者が異なる代理申請を認めるか、その場合に誰の役職で判定するかは別の業務上の未決事項である。作業者を一意に識別できることから、代理申請の可否は推定しない。\n\n認証・セッション管理は一般的なWebアプリのセキュリティ要件に沿うものとする。具体的な技術条件はシステム要件（SR）で定める。認証プロトコルやセッションの有効期限等の詳細は未定である。\n\n## 購入申請の扱い\n\n購入申請は、申請者が業務上必要とする備品の購入要求を、承認および購買の対象として扱うための記録である。\n\n購入申請は、後述のObject 購入申請のInformationに挙げる情報を少なくとも持つ。\n\n購入申請は一意に識別できるものとする。識別子の採番・入力方法はこの業務設計では規定しない。\n\n一つの購入申請には複数の品目を含められる。各品目の希望金額は税抜希望単価×数量で算出し、申請全体の税抜合計額を申請者の役職別決裁上限額と比較する。\n\n提出して確定した内容を直接変更しない。差戻し・再申請では、何をいつ確定したか識別できる別の提出版を用いる方向とする。版の識別方法や下書きとの関係はレビュー中の設計候補である。\n\n## 業務相関\n\n1. 購買担当者がシステム外で見積書を取得して依頼部署へ返す。依頼部署は見積条件で経費を使うか判断する。見積取得機能は本システムに設けない。\n2. 申請者は依頼全体の見積書を添え、複数品目の品名・税抜単価・数量と購入理由を提出する。全品目の税抜小計の合計が役職別上限以下と自動判定できた場合だけ申請が成立する。見積書なし、権限不適合・判定不能では成立しない。下書きは必須値が未入力でも保存できる。今回は見積条件どおりの価格を前提とし、権限に収まらなければ別の人が申請するか見積内容を変える。代理操作の許可を意味しない。\n3. 承認者は申請内容を判断し、承認または差戻しを行う。承認後も購入準備確定前は差戻し可、準備確定後は不可。確定提出版を直接変更せず、再申請で別の確定版を区別する。旧承認判断の業務履歴は不要だが、古い判断を現在の購買根拠として使わない。\n4. 購買担当者は複数の承認済み申請を申請単位で一つの準備番号へまとめる。一申請を品目別に別準備へ分割しない。番号・対象・差戻し不可を一貫して確定する。CSV失敗・紛失でも同じ番号・同じ凍結内容で再出力する。書き出し日は分かるが発注日ではなく、出力で購入完了にはしない。\n5. CSV書き出し後の発注管理は購買側システムが行う。本システムで発注日を管理せず、発注情報の追加受信を前提にしない。\n6. 倉庫への分割納品を扱い、購買担当者が各回の入庫結果を登録する。代替品は今回禁止する。調達不能時は購買担当者と申請者で購入しない数量を調整し、元の承認者は介入しない。元の提出内容・準備内容を上書きしない。\n7. 全依頼数量を品目ごとに入庫済み・今後購入しないと確定・未入庫待ちに区別する。待ちが残れば作業中とし、全数量の結末がそろったら申請全体を一度だけ終結する。全数入庫、一部入庫と残り購入なし、全数購入なしの3つを区別する。最終終結の訂正は扱わない。分割納品を別発注による分割購入の許可と解釈しない。\n8. 下書き・差戻しから再申請または破棄を選べる。再申請にも見積書必須と税抜合計の権限判定を適用する。\n\n## 調達不能時の調整\n\n依頼10個に対して5個入庫・5個待ちなら作業中、5個入庫・残り5個を購入しないと確定すれば終了する。8個入庫・2個待ちを完了にしない。代替品は購入しない。全数を購入しないと決めた場合は入庫実績0件でも終結できる。数量減・購入なしの調整に元の承認者は介入しない。調整理由・合意者などの保存範囲は未決である。\n\n## 現在の業務設計で未決定の事項\n\n次の事項は現在の業務設計では定めない。\n\n- 申請金額によって承認者や承認段階が変わる場合の扱い\n- 見積取得、在庫確認、実発注・発注日の管理、検収、支払、倉庫内の在庫・払出管理（分割納品の入庫結果登録は対象）\n- 購入先の選定方法\n- 購入後の備品管理、資産管理、廃棄\n- 基幹システムからの従業員情報・役職別上限額の参照、外部認証基盤によるSSO、購入用CSVの出力以外の外部システム連携\n- 監査履歴や通知に関する業務\n- 役職別上限額の具体的な値、基幹システムを参照する際の運用条件\n- CSVに含める列・出力形式・配布管理・再出力の担当と履歴、最終調達結果の入力方式（手入力・CSV取込等）。ただし購入準備番号と同番号での再出力は合意済み\n- 調達不能時の申請者との合意確認・記録範囲。数量減・購入なしの調整に元承認者は介入せず、代替品は禁止とする\n- 数量・金額の数値範囲、端数、最終的な実購入金額の税区分\n- 一括却下・一括結果登録の採用（今回の改善では採用していない）\n\nこれらは、現在の業務設計を実装するために決定済みであるとはみなさない。\n\n## 確認が必要な事項（未確認）\n\n承認と差戻しの業務境界はF01、購入準備と購入結果登録の分離はF02、認証基盤からの作業者識別情報の受取りはF03に解消内容を記録する。代理申請の可否・適用する役職は、F03とは別の業務上の未決事項として残す。\n\n- **購入できない場合・結果登録できない場合**：購入しない数量を申請者と調整し、入庫済み数量と区別する。合意記録の粒度は未決。技術的な失敗時の重複防止と安全な再試行は設計・実装で保証する。購入日時・入庫日・登録日時を同一と定めない。\n- **入力不足・状態が変わった場合**：提出には見積書と品目情報が必要で、権限判定不能なら成立しない。下書きは未入力可。承認・差戻し・準備確定は処理時にも状態を再確認し、差戻しと準備の同時成功を認めない。数量・金額の具体的な範囲・精度は未決。\n\n基幹システムの役職別上限額に不適合または判定不能の場合の申請不成立と、承認業務中の差戻し、差戻し・下書きからの再申請または破棄は後述のとおりとする。それ以外の未記載の操作結果は未決である。\n\n- **破棄・再申請不成立の扱い**：申請中断時の下書き保存と、その下書きからの再開は後述のとおりとする。破棄時の物理削除・履歴保持、再申請が権限判定で成立しなかった後の元の申請内容の扱いは未確認である。下書きの自動保存や、破棄後の保存期間は規定しない。\n\n## 参照する基幹システム\n\n基幹システムは、従業員の識別情報・役職と、役職ごとの決裁単位の上限額を提供する外部システムである。決裁単位は購入申請1件とし、申請者の役職に対応する上限額を用いる。従業員情報は人事、役職別上限額に関する情報は総務が管理する。\n\n今回の業務は基幹システムから必要な情報を参照し、その保守は扱わない。内部のテーブル単位にはObjectを分けない。具体的な上限額や参照時の運用条件は未確認である。認証済み利用者と従業員情報の具体的なキー対応はSR・実装側で定める。\n\n# Scope\n\n社内の備品購入について、基幹システムの役職別上限額に基づく申請可否の自動判定、申請と中断時の下書き保存、承認と購入準備前の差戻し、下書き・差戻しからの再申請または破棄、承認済み申請の購入準備番号の確定と購入用CSV出力・再出力、調達不能時の申請者との調整に基づく最終クローズ、および最終結果の登録を扱う。見積取得、実際の購入・在庫確認・発注管理・発注日・交渉手段はシステムのスコープ外とする。代替品の購入は禁止し、倉庫への各回の入庫結果登録と全数量の終結は対象とする。交渉後の合意記録とシステムでの結果確定の境界は人間レビュー前の草案である。購入申請はこの業務で成立・更新する記録である。申請者・承認者・購買担当者のObjectは、各業務で情報を入力・選択する人を表し、人自体を成立・管理する業務は扱わない。基幹システムは従業員情報・役職別上限額を提供するスコープ外のObjectであり、内部のテーブル構造や同システムの保守は今回の業務に含めない。認証基盤もスコープ外のObjectとして利用し、認証済み作業者の識別情報を受け取る。利用者登録・認証基盤の管理、独立したログイン業務は今回扱わない。前述の対象外業務や未採用の一括却下・一括結果登録は含めず、未確認の条件を決定済みとはみなさない。\n\n# Object 申請者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- 申請したい品目（品名 / 税抜希望単価 / 数量）\n- 購入理由\n- 申請を中断して下書き保存する選択\n- 再申請または破棄の選択\n- 依頼全体の見積書（提出時必須、下書きでは未入力可）\n- 調達不能時の数量減・購入不要についての回答（合意の記録方法は未決）\n\n# Object 承認者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- 承認可否を判断する対象購入申請\n- 差戻し理由\n\n# Object 購買担当者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- CSV出力の対象購入申請と購入準備番号\n- 購入内容の調達可否と申請者との調整結果（保存範囲は未決）\n- 最終結果を登録する対象購入申請\n- 各回の入庫品目・数量と、今後購入しない確定数量\n- 実購入内容・実購入金額（税区分・粒度は未決）\n\n# Object 購入申請\n\n## Scope\n\ntrue\n\n## Icon\n\nfile-text\n\n## Information\n\n- 申請者\n- 申請品目（複数。品名 / 税抜希望単価 / 数量。品目税抜小計は税抜希望単価×数量）\n- 申請全体の税抜希望合計金額（全品目小計の合計）\n- 購入理由\n- 提出版と申請日時（確定した版の内容は編集不能）\n- 依頼全体の見積書と確定提出版との対応\n- 状態（下書き / 差戻し / 申請済み / 承認済み。準備後の作業中と終結は区別し、正式な表示名はレビュー中）\n- 現在有効な承認の判断 / 承認日時\n- 差戻し日時 / 差戻し理由\n- 購入準備番号（準備前は存在せず、確定後は差戻し不可）\n- 調達内容の調整結果（購入しない数量に関する申請者との合意。保存粒度は未決）\n- 各回の入庫実績、品目別入庫累計、購入しない確定数量、未入庫待ち数量\n- 最終調達結果（申請ごとに最大1件の終結。全数入庫／一部入庫と残り購入なし／全数購入なしを区別。終結後の訂正は扱わない）\n\n# Object 基幹システム\n\n## Scope\n\nfalse\n\n## Icon\n\nserver\n\n## Medium\n\nデータベース\n\n## SR Dependencies\n\n- 従業員の識別情報・役職・役職別決裁上限額を参照する契約\n\n## Information\n\n- 従業員の識別情報\n- 役職\n- 役職ごとの決裁単位の上限額\n\n# Object 購入用CSV\n\n## Scope\n\ntrue\n\n## Icon\n\nfile-spreadsheet\n\n## Medium\n\nCSV\n\n## Information\n\n- 購入準備番号\n- 承認済み購入申請の識別情報\n- 購入準備確定時の提出版と申請内容\n\n# Object 認証基盤\n\n## Scope\n\nfalse\n\n## Icon\n\nshield-check\n\n## SR Dependencies\n\n- 認証済み作業者の識別情報を取得する契約\n\n## Information\n\n- 認証済み利用者の識別情報\n\n# Activity 備品購入を申請する\n\n## Scope\n\ntrue\n\n## Why\n\n購入の必要性と希望内容を記録し、承認者が購入可否を判断できる状態にするため。\n\n## When\n\n申請者が、業務上必要な備品を購入したいと判断したとき。\n\n## Who\n\n申請者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 認証基盤 — 認証済み作業者の識別情報\n- 申請者 — 複数の品目（品名 / 税抜希望単価 / 数量） / 購入理由 / 依頼全体の見積書（提出時は見積書と品目情報を必須とする） / 申請を中断して下書き保存する選択\n- 基幹システム — 従業員の識別情報 / 役職 / 役職ごとの決裁単位の上限額\n\n### Procedure\n\n業務に必要な備品の購入要求を、購入申請として登録する。認証基盤から受け取る認証済み作業者の識別情報で作業者を一意に特定する。代理申請の範囲は、前述の未決事項に従う。\n\n1. 申請者が必要な品目ごとの品名・税抜希望単価・数量と購入理由を入力し、外部取得済みの依頼全体の見積書を添付する。1申請で複数品目を指定できる。見積なしでは提出を成立させない。\n2. 各品目の税抜小計を税抜希望単価×数量で算出し、全品目の小計を合計して申請の税抜希望合計金額を求める。\n3. 申請者に対応する基幹システムの情報から、申請者の役職を確認する。\n4. 申請全体の税抜希望合計金額が、その役職に対応する基幹システムの役職別上限額以下であるか、自動判定する。\n5. 適合すると判定できた申請を、新しい購入申請として登録する。\n6. 新規Object「購入申請」を状態「申請済み」で保存する（作成前 → 申請済み）。\n\n### Exception\n\n- **権限判定不成立** — 基幹システムの役職別上限額に適合しない場合、または規定の矛盾・必要情報の不足などで適合すると判定できない場合は、申請を成立させず、`申請済み` の購入申請を作成しない。この申請不成立を、承認業務による差戻しとは扱わない。\n\n- **作業中断** — 申請者が提出前に申請業務を中断し、下書き保存を選んだ場合は、申請者と入力途中の内容を購入申請へ「下書き」の状態で新規保存する（作成前 → 下書き）。提出時の必須項目が未入力でも下書き保存できる。下書き保存では `申請済み` の成立や権限判定の通過を意味せず、承認・購入の対象にしない。保存した下書きは「購入申請を再申請・破棄する」で再開し、内容を整えて提出するか、破棄するかを選べる。\n\n### Output\n\n- 購入申請 — 提出時は申請者 / 複数の品目（品名・税抜希望単価・数量） / 申請の税抜希望合計額 / 購入理由 / 申請日時 / 確定した提出版と根拠の見積書 / `申請済み` の状態。中断して下書き保存した場合は申請者 / 入力途中の申請内容 / 下書きの状態\n\n## Result\n\n- 基幹システムの役職別上限額への適合を自動判定で確認した購入要求が、`申請済み` の購入申請として記録される。\n- 申請者、申請品目ごとの税抜希望単価・数量、申請全体の税抜希望合計、購入理由、申請日時が保持される。\n- 承認者が購入可否を判断できる状態になる。\n\n# Activity 購入申請を承認する\n\n## Scope\n\ntrue\n\n## Why\n\n申請内容が妥当であることを確認し、購買担当者が購入を進められる状態にするため。\n\n## When\n\n購入申請が `申請済み` として提出されたとき。または、承認済みの申請について、**購入準備がまだ確定していない**段階で承認者が差戻しを判断したとき。\n\n## Who\n\n承認者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 認証基盤 — 認証済み作業者の識別情報\n- 承認者 — 承認可否を判断する対象購入申請の選択（必須） / 差し戻す場合の差戻し理由（必須）\n- 購入申請 — 対象購入申請の確定した提出内容と、`申請済み` または購入準備未確定の `承認済み` の状態\n\n### Procedure\n\n認証基盤から受け取る認証済み作業者の識別情報で、承認業務の作業者を一意に特定する。提出された購入申請の購入可否は、承認者が業務中に人間として判断し、その責任を負う。以下は承認する場合の正常手順である。\n\n1. 承認者が、対象となる `申請済み` の購入申請を選択し、その内容を確認する。\n2. 購入してよいと判断する。\n3. 対象Object「購入申請」の状態を「申請済み」から「承認済み」へ変更する。\n4. 承認日時を記録する。\n\n### Exception\n\n- **差戻し** — 承認者が業務中に購入を認めないと判断した場合は、対象購入申請を `申請済み` から `差戻し` へ変更し、差戻し理由・日時を記録して申請者に再申請・破棄の選択を戻す。この場合は承認を成立させない。\n- **承認後差戻し** — すでに `承認済み` でも**購入準備番号が未確定**なら承認者は判断を変更して `差戻し` にできる。以前の承認を現在有効な購買根拠から外し、再申請・破棄の業務へ戻す。過去の承認判断の業務履歴は必須としない。購入準備確定後の差戻しや、同時に両操作を成立させることは認めない。\n\n### Output\n\n- 購入申請 — 承認の結果（`承認済み` の状態 / 承認日時）、または差戻しの結果（差戻しの状態 / 差戻し理由 / 差戻し日時）\n\n## Result\n\n- 対象購入申請が `承認済み` になる。\n- 承認日時が記録される。\n- 購買担当者が購入対象として扱える状態になる。\n\n# Activity 購入申請を再申請・破棄する\n\n## Scope\n\ntrue\n\n## Why\n\n下書きや差し戻された購入申請を、再び承認に進めるか、不要な申請内容を破棄するか確定するため。\n\n## When\n\n申請者が、保存済みの下書きの購入申請から作業を再開するとき。\n\n## Exception When\n\n- 備品購入を申請する — 作業中断：申請者が提出前に作業を中断して下書き保存し、その下書きから作業を再開するとき\n- 購入申請を承認する — 差戻し：購入を認めないと判断され、購入申請が申請者へ差し戻されたとき\n- 購入申請を承認する — 承認後差戻し：購入準備番号が未確定の承認済み申請を、承認者が判断変更して差し戻したとき\n\n## Who\n\n申請者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 認証基盤 — 認証済み作業者の識別情報\n- 申請者 — 再申請または破棄の選択 / 再申請する品目（品名・税抜希望単価・数量、複数可）と購入理由 / 依頼全体の見積書\n- 購入申請 — 対象の申請内容 / 下書きまたは差戻しの状態 / 差し戻された場合の理由\n- 基幹システム — 従業員の識別情報 / 役職 / 役職ごとの決裁単位の上限額\n\n### Procedure\n\n認証基盤から受け取る認証済み作業者の識別情報で作業者を一意に特定する。申請者は対象の申請内容について再申請または破棄を選ぶ。代理申請の範囲は前述の未決事項に従う。以下は再申請する場合の正常手順である。\n\n1. 下書きまたは差し戻された対象購入申請の内容を確認する。差し戻された場合は、その理由も確認する。\n2. 再申請する複数の品目（品名・税抜希望単価・数量）と購入理由を入力し、依頼全体の見積書を確認・添付する。見積なしでは再申請を成立させない。各品目小計の合計を求める。\n3. 基幹システムから申請者の役職を確認し、申請全体の税抜希望合計金額が役職別上限額以下であるか自動判定する。\n4. 適合すると判定できた内容を、従前の確定内容を変更せず新たな提出版として確定し、対象Object「購入申請」を再申請する。状態を「下書き」または「差戻し」から「申請済み」へ変更し、申請日時を記録する。\n\n### Exception\n\n- **申請内容の破棄** — 再申請せず破棄することを選んだ場合は、対象の申請内容を破棄する。破棄した内容を以後の承認・購入の対象にしない。対象Objectは「購入申請」、変更前は「下書き」または「差戻し」。処理後の保存状態は未決である。\n- **再申請不成立** — 基幹システムの役職別上限額に適合しない場合、または必要情報の不足や矛盾等で判定できない場合は、再申請を成立させず、`申請済み` の状態へ変更しない。その後の元の申請内容の扱いは未確認である。過去に確定した提出版を直接編集しない。\n\n### Output\n\n- 購入申請 — 再申請した確定提出版と根拠の見積書 / `申請済み` の状態 / 申請日時、または対象の申請内容の破棄\n\n## Result\n\n- 対象購入申請が権限判定を通った内容で `申請済み` として再申請され、承認者が再び可否を判断できる。\n\n# Activity 購入を準備する\n\n## Scope\n\ntrue\n\n## Why\n\n承認済みの購入要求を複数まとめ、後から同一内容を再出力できる購入準備として確定し、システム外の購入作業へ渡すため。\n\n## When\n\n購入申請が `承認済み` で、まだ購入準備番号を確定していないとき。\n\n## Who\n\n購買担当者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 認証基盤 — 認証済み作業者の識別情報\n- 購買担当者 — 購入準備対象の承認済み購入申請（複数可）\n- 購入申請 — 対象申請の識別情報 / 確定した提出内容 / 現在有効な承認 / 準備未着手であること\n\n### Procedure\n\n1. 認証済み作業者を一意に特定する。\n2. 購買担当者が承認済みの購入申請を選択する。一つの申請の品目を別々の準備へ分割しない。\n3. その購入準備に一つの購入準備番号を発行し、選択した申請を同じ番号に紐づける。番号と対象の確定後は承認者の差戻しを認めない。差戻し操作と準備確定が競合したら、両方の成功を許さない。\n4. 確定した購入準備番号と同じ申請内容を使って購入用CSVを出力し、システム外の購買へ渡す。出力完了だけでは購入済みにしない。\n\n### Exception\n\n- **CSV再出力** — CSVの生成失敗または紛失があった場合、購入準備番号と対象を取り消さず、**同じ番号・同じ確定内容**で再出力する。通常の失敗時の安全な再試行や二重処理防止は設計・実装で保証する。\n- **購入準備競合** — 対象申請が同時に差し戻された、またはすでに別の準備に組み込まれた場合は、重複した準備確定を成立させない。具体的な通知とやり直し操作は未決。\n\n### Output\n\n- 購入申請 — 購入準備番号とその番号に属する対象申請。元の提出内容は変更しない\n- 購入用CSV — 購入準備番号 / 対象購入申請の識別情報 / 購入準備確定時の申請内容\n\n## Result\n\n購入準備番号と対象が確定し、承認者の差戻しができない。CSVの成否と区別して購入準備の確定を保持し、失敗時も同じ準備を再出力できる。\n\n# Activity 購入結果を登録する\n\n## Scope\n\ntrue\n\n## Why\n\n分割納品の各回の入庫結果と購入しない数量を記録し、全依頼数量の結末がそろった申請を終結するため。\n\n## When\n\n購入準備済みの申請について倉庫への入庫があったとき、または購買担当者と申請者が今後購入しない数量を確定したとき。\n\n## Who\n\n購買担当者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 認証基盤 — 認証済み作業者の識別情報\n- 購買担当者 — 対象申請 / 各回の入庫品目と数量 / 今後購入しない確定数量。実績金額・日付の詳細な粒度は未決\n- 購入申請 — 確定提出版と品目・依頼数量 / 購入準備番号 / 既存入庫累計 / 購入しない確定数量 / 終結の有無\n- 申請者 — 調達不能時の数量減・購入なしについての合意（記録方法は未決）\n\n### Procedure\n\n1. 認証済み作業者を一意に特定し、準備済みで未終結の対象申請と、変更不能の提出内容を確認する。\n2. 各回の入庫結果を元の申請品目へ対応させて登録する。分割納品では複数回登録できる。代替品を登録せず、元の品名・数量・単価や準備内容を上書きしない。\n3. 調達できない残数は購買担当者と申請者で調整し、今後購入しない確定数量として入庫実績とは分けて記録する。元の承認者は介入しない。\n4. 各品目で「依頼数量＝入庫累計＋購入しない確定数量＋未入庫待ち」を確認する。過剰数量や別申請・旧版の品目への登録を成立させない。\n5. いずれかの品目に待ちが残れば作業中を維持する。すべての品目の待ちが0なら申請全体を一度だけ終結し、全数入庫／一部入庫と残り購入なし／全数購入なしを区別する。終結後の訂正は扱わない。\n\n### Exception\n\n- **調達不能・購入断念** — 申請者との調整で、残数量または全数量を購入しないと確定する。入庫0件でも終結できる。承認拒否や再申請への差戻しとは扱わない。\n\n### Output\n\n- 購入申請 — 各回の入庫結果 / 品目別入庫累計と購入しない確定数量・未入庫待ち / 作業中または申請単位の終結結果\n\n## Result\n\n各回の入庫と今後購入しない数量が元の確定品目に対応して記録される。待ちが残る申請は作業中となり、全数量の結末が確定した申請のみ終結する。失敗後の再送で実績を重複させず、二重の最終結果を作らない。\n\n# Findings\n\n## Finding F01\n\n### Kind\n\ncorrection\n\n### Status\n\nresolved\n\n### Scope\n\nitems\n\n### Targets\n\n- 購入申請を承認する\n\n### Summary\n\n承認業務中に可否を判断し、拒否時は再申請・破棄の業務へ差し戻す\n\n### Content\n\n旧版では承認・却下のWhenが可否判断後である一方、Procedureは内容確認から始まり、開始条件と判断の範囲が整合していなかった。\n\n人間の判断に基づき、申請済みの購入申請の提出を入口として承認業務を開始し、可否はその業務中に承認者が判断する。独立していた却下Activityは承認業務へ統合した。追加の人間判断に基づき、購入を認めない場合はHowのExceptionで申請者へ差し戻し、「購入申請を再申請・破棄する」のException Whenへつなぐ。申請者は差戻し・下書きから再申請または破棄を選べる。承認の正常結果承認済みと、再申請前の差戻しを区別する。\n\n## Finding F02\n\n### Kind\n\ncorrection\n\n### Status\n\nresolved\n\n### Scope\n\nitems\n\n### Targets\n\n- 購入を準備する\n- 購入結果を登録する\n\n### Summary\n\n購入準備と購入結果登録を分離し、実購入はシステム外で行う\n\n### Content\n\n旧Activityは購入前の確認と実購入・結果登録を含む一方、Inputが購入後の情報を前提としていた。\n\n人間の判断に基づき、「購入を準備する」で承認済み購入申請を購入用CSVへ出力し、実際の購入作業をシステム外とした。追加ヒアリングを反映し、「購入結果を登録する」で分割納品の各回の入庫実績と購入しない確定数量を記録する。待ちが残れば作業中とし、全品目の結末がそろった場合だけ申請を終結する。購買側で承認を拒否することと、申請者と調整して残数量を購入しないことは区別する。代替品は禁止。CSV出力だけで購入完了にはしない。入庫日・実績金額の詳細やCSV形式、調整の合意記録範囲は未決として残す。\n\n## Finding F03\n\n### Kind\n\nquestion\n\n### Status\n\nresolved\n\n### Scope\n\nitems\n\n### Targets\n\n- 備品購入を申請する\n\n### Summary\n\n認証基盤から認証済み利用者の識別情報を受け取り、作業者を一意に特定する\n\n### Content\n\n人間の判断に基づき、外部の認証基盤によるSSOで作業者を一意に特定し、認証済みセッションを複数の画面・操作で継続利用する。スコープ外のObject「認証基盤」を置き、各ActivityのInputに認証済み作業者の識別情報を明記した。申請時・再申請時には、その利用者に対応する従業員情報・役職を参照する。\n\n具体的な製品名、認証プロトコル、Windowsログインとの連携方法、認証基盤と基幹システムの属性・キーの対応付け、セッション管理の技術条件はSR・実装側で具体化する。ID・パスワードの登録や入力を必須の業務手順にせず、独立したログインActivityも追加しない。\n\nこれにより作業者の識別情報の出所と利用方針を確定し、F03を解消する。代理申請の可否・その場合に誰の役職を使うかは、別の業務上の未決事項として前書きに保持する。申請者に対応する従業員情報や役職を確認できず判定不能となる場合は、既決のとおり申請不可とする。\n\n## Finding F04\n\n### Kind\n\ncorrection\n\n### Status\n\nresolved\n\n### Scope\n\nitems\n\n### Targets\n\n- 備品購入を申請する\n- 購入申請を再申請・破棄する\n\n### Summary\n\n申請中断時の下書き保存から、既存の再開業務へつなぐ\n\n### Content\n\n旧版では下書きから再開する業務を定義していたが、下書きを作る業務経路がなく、下書きの生成元を未確認として残していた。\n\n人間の判断に基づき、「備品購入を申請する」のExceptionに提出前の中断・下書き保存を追加した。申請者と入力途中の内容を下書きとして出力し、「購入申請を再申請・破棄する」のWhen・Exception When・Inputへつなぐ。下書きは提出済みではなく、必須項目の入力途中でも保存できる。再開後に提出する場合は既存の必須項目・権限判定を適用し、適合した場合に申請済みへ変更する。破棄する選択も既存どおり保持する。\n"

      "text": "# 備品購入申請 — 業務設計\n\n社内で使用する備品の購入申請から購入完了までに必要となる業務を記述する。\n\n業務上の意味・前提・入力・手順・結果を記述し、画面部品、API、クラス、モジュール、データアクセス方法などの実装方式は規定しない。\n\n## 業務上のロール\n\n- **申請者** — 業務に必要な備品の購入を申請する。\n- **承認者** — 申請内容を確認し、購入を承認または却下する。\n- **購買担当者** — 承認済みの申請に基づいて購入を行い、購入結果を登録する。\n\nロールは業務上の責任と権限を表す。\n\n## 購入申請の扱い\n\n購入申請は、申請者が業務上必要とする備品の購入要求を、承認および購買の対象として扱うための記録である。\n\n購入申請は、後述のObject 購入申請のInformationに挙げる情報を少なくとも持つ。\n\n購入申請は一意に識別できるものとする。識別子の採番・入力方法はこの業務設計では規定しない。\n\n## 業務相関\n\n現在定義している主な業務相関は次のとおりである。\n\n1. 備品購入を申請すると、`submitted` の購入申請が成立する。\n2. `submitted` の購入申請を承認すると、`approved` になる。\n3. `submitted` の購入申請を却下すると、`rejected` になる。\n4. `approved` の購入申請に基づいて購入すると、`purchased` になる。\n5. `rejected` の購入申請は購買対象にならない。\n\n## 現在の業務設計で未決定の事項\n\n次の事項は現在の業務設計では定めない。\n\n- 申請金額によって承認者や承認段階が変わる場合の扱い\n- 在庫確認、発注、納品、検収、支払に関する業務\n- 購入先の選定方法\n- 購入後の備品管理、資産管理、廃棄\n- 外部システムとの連携\n- 監査履歴や通知に関する業務\n\nこれらは、現在の業務設計を実装するために決定済みであるとはみなさない。\n\n# Scope\n\n社内の備品購入について、申請・承認・却下・購入と購入結果の登録を扱う。購入申請はこの業務で成立・更新する記録である。申請者・承認者・購買担当者のObjectは、各業務で情報を入力・選択する人を表し、人自体を成立・管理する業務は扱わない。前述の未決定事項は今回の対象に含めない。\n\n# Object 申請者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- 品名\n- 数量\n- 希望購入金額\n- 購入理由\n\n# Object 承認者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- 承認する対象購入申請\n- 却下する対象購入申請\n- 却下理由\n\n# Object 購買担当者\n\n## Scope\n\nfalse\n\n## Icon\n\nusers\n\n## Information\n\n- 購入した対象購入申請\n- 実購入金額\n\n# Object 購入申請\n\n## Scope\n\ntrue\n\n## Icon\n\nfile-text\n\n## Information\n\n- 申請者\n- 品名\n- 数量\n- 希望購入金額\n- 購入理由\n- 申請日時\n- 状態: `submitted` / `approved` / `rejected` / `purchased`\n- 承認日時\n- 却下日時\n- 却下理由\n- 購入日時\n- 実購入金額\n\n# Activity 備品購入を申請する\n\n## Scope\n\ntrue\n\n## Why\n\n購入の必要性と希望内容を記録し、承認者が購入可否を判断できる状態にするため。\n\n## When\n\n申請者が、業務上必要な備品を購入したいと判断したとき。\n\n## Who\n\n申請者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 申請者 — 品名 / 数量 / 希望購入金額 / 購入理由（すべて必須）\n\n### Procedure\n\n業務に必要な備品の購入要求を、購入申請として登録する。\n\n1. 申請者が購入したい備品と購入理由を入力する。\n2. 希望する数量と購入金額を入力する。\n3. 新しい購入申請として登録する。\n4. 登録した申請を `submitted` として扱う。\n\n### Output\n\n- 購入申請 — 申請者 / 品名 / 数量 / 希望購入金額 / 購入理由 / 申請日時 / `submitted` の状態\n\n## Result\n\n- 購入要求が `submitted` の購入申請として記録される。\n- 申請者、品名、数量、希望購入金額、購入理由、申請日時が保持される。\n- 承認者が購入可否を判断できる状態になる。\n\n# Activity 購入申請を承認する\n\n## Scope\n\ntrue\n\n## Why\n\n申請内容が妥当であることを確認し、購買担当者が購入を進められる状態にするため。\n\n## When\n\n`submitted` の購入申請について、承認者が購入してよいと判断したとき。\n\n## Who\n\n承認者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 承認者 — 承認する対象購入申請の選択（必須）\n- 購入申請 — 対象購入申請の内容と `submitted` の状態\n\n### Procedure\n\n提出された購入申請について、購入を承認する。\n\n1. 承認者が `submitted` の購入申請を確認する。\n2. 購入してよいと判断した申請を選択する。\n3. 対象の購入申請を `approved` とする。\n4. 承認日時を記録する。\n\n### Output\n\n- 購入申請 — `approved` の状態 / 承認日時\n\n## Result\n\n- 対象購入申請が `approved` になる。\n- 承認日時が記録される。\n- 購買担当者が購入対象として扱える状態になる。\n\n# Activity 購入申請を却下する\n\n## Scope\n\ntrue\n\n## Why\n\n購入を認めないと判断した申請について、購買対象から外すため。\n\n## When\n\n`submitted` の購入申請について、承認者が購入を認めないと判断したとき。\n\n## Who\n\n承認者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 承認者 — 却下する対象購入申請の選択 / 却下理由（すべて必須）\n- 購入申請 — 対象購入申請の内容と `submitted` の状態\n\n### Procedure\n\n提出された購入申請について、購入しないことを確定する。\n\n1. 承認者が `submitted` の購入申請を確認する。\n2. 購入を認めないと判断した申請を選択する。\n3. 却下理由を記録する。\n4. 対象の購入申請を `rejected` とする。\n5. 却下日時を記録する。\n\n### Output\n\n- 購入申請 — `rejected` の状態 / 却下理由 / 却下日時\n\n## Result\n\n- 対象購入申請が `rejected` になる。\n- 却下理由と却下日時が記録される。\n- 購買担当者の購入対象にはならない。\n\n# Activity 承認済み備品を購入する\n\n## Scope\n\ntrue\n\n## Why\n\n承認された購入要求を実際の購入として完了させ、購入済みであることを記録するため。\n\n## When\n\n`approved` の購入申請について、購買担当者が対象備品を購入するとき。\n\n## Who\n\n購買担当者\n\n## Where\n\n規定なし。\n\n## How\n\n### Input\n\n- 購買担当者 — 購入した対象購入申請の選択 / 実購入金額（すべて必須）\n- 購入申請 — 対象購入申請の内容と `approved` の状態\n\n### Procedure\n\n承認済みの購入申請に基づいて備品を購入し、その結果を登録する。\n\n1. 購買担当者が `approved` の購入申請を確認する。\n2. 対象備品を購入する。\n3. 実購入金額を記録する。\n4. 対象購入申請を `purchased` とする。\n5. 購入日時を記録する。\n\n### Output\n\n- 購入申請 — `purchased` の状態 / 実購入金額 / 購入日時\n\n## Result\n\n- 対象購入申請が `purchased` になる。\n- 実購入金額と購入日時が記録される。\n- 対象申請が購入済みとして扱える状態になる。\n"

      "text": "# 備品購入申請のチェック項目\n\n原典は未合意の[備品購入申請の業務設計](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md)です。この項目書も業務設計の確定版や実装への合意済み引継ぎではありません。[使い方](#使い方)\n\n## 業務一覧\n\n| 業務（Activity） | 目的 | 業務設計に記載された接続 | チェック項目 |\n| --- | --- | --- | --- |\n| [備品購入を申請する](#備品購入を申請する) | 購入の必要性と希望内容を記録し、承認者が購入可否を判断できる状態にする | `submitted` の購入申請を、承認または却下の判断へ渡す | [JA-EX-01](#ja-ex-01--新しい購入申請が提出済みになる) |\n| [購入申請を承認する](#購入申請を承認する) | 申請内容の妥当性を確認し、購買担当者が購入を進められる状態にする | `submitted` を `approved` とし、「承認済み備品を購入する」の購入対象にする | [JA-EX-02](#ja-ex-02--対象の申請が承認済みになる)、未決事項 [JA-EX-Q01](#ja-ex-q01--金額によって承認者や承認段階が変わる場合の扱い) |\n| [購入申請を却下する](#購入申請を却下する) | 購入を認めない申請を、購買対象から外す | `submitted` を `rejected` とし、「承認済み備品を購入する」の購入対象から外す | [JA-EX-03](#ja-ex-03--対象の申請が却下済みになる)、[JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない) |\n| [承認済み備品を購入する](#承認済み備品を購入する) | 承認された購入要求を実際の購入として完了させ、購入済みであることを記録する | `approved` の申請に基づく購入を `purchased` として記録する。「購入申請を却下する」の却下対象は含めない | [JA-EX-05](#ja-ex-05--購入した対象の申請が購入済みになる)、共有項目 [JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない) |\n\n## 備品購入を申請する\n\n### 申請の条件・保証と例\n\n申請者が業務上必要な備品を購入したいと判断し、品名・数量・希望購入金額・購入理由を**すべて必須入力**として、新しい購入申請を登録する。入力の存在は必要条件であり、値の妥当性や、それだけで登録できる十分条件は定められていない。[JA-EX-01](#ja-ex-01--新しい購入申請が提出済みになる) の一般保証は、この登録で購入要求が `submitted` の購入申請として記録されることである。申請しただけで承認・却下が済むわけではない。\n\n次の値は結果の違いを読むための例示であり、数量や金額の許容範囲を定めない。いずれも申請者が新しい購入申請を登録する場面である。\n\n| 対象・入力 | 必須入力の充足 | 観測する結果 | 対応 |\n| --- | --- | --- | --- |\n| 新しい申請A：品名「机」、数量2、希望購入金額20,000、購入理由「執務席用」 | 4項目がある | 登録された申請Aが `submitted` になる。机・2・20,000・理由は申請Aの内容であり、別の申請を承認した結果ではない | [JA-EX-01](#ja-ex-01--新しい購入申請が提出済みになる) |\n| 新しい申請B：品名「机」、数量2、希望購入金額20,000、購入理由なし | 必須の購入理由がない | 必須条件を満たさない。登録の成否、通知や復帰方法は業務設計では未決定であり、`submitted` にならないという逆向きの保証もここでは定めない | [JA-EX-01](#ja-ex-01--新しい購入申請が提出済みになる) |\n\n### JA-EX-01 — 新しい購入申請が提出済みになる\n\n- 人間レビュー状態：未レビュー\n- 条件・期待結果：[申請の条件・保証と例](#申請の条件保証と例)に示す JA-EX-01 の一般保証を参照。[同節の比較例](#申請の条件保証と例)\n- 根拠：[「Activity 備品購入を申請する」のWhen・Who・How・Result](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L123-L168)。Inputの「すべて必須」を適用する。\n- 導出分類：明示。AI確度：高。\n- 関連業務：成立した申請を、「購入申請を承認する」または「購入申請を却下する」で扱う。申請だけでは購入可否の判断は済まない。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。\n\n## 購入申請を承認する\n\n### 承認の条件・保証と例\n\n承認者が `submitted` の購入申請について購入してよいと判断し、その対象を選択して承認する。[JA-EX-02](#ja-ex-02--対象の申請が承認済みになる) の一般保証は、**その対象購入申請**が `approved` になることである。承認した時点で購入を済ませたことにはならない。金額による承認者・承認段階の変更は[JA-EX-Q01](#ja-ex-q01--金額によって承認者や承認段階が変わる場合の扱い)に残す。\n\n同じ申請A（品名「机」、数量2、希望購入金額20,000、購入理由「執務席用」）を対象として承認を行う場合を比べる。金額20,000は閾値を意味しない。\n\n| 対象の事前状態 | 承認者の判断・対象選択 | 観測する結果 | 対応 |\n| --- | --- | --- | --- |\n| 申請Aは `submitted` | 購入してよいと判断し、申請Aを選択 | 承認後の申請Aが `approved`。別の申請ではなく、選んだ申請の状態が変わる | [JA-EX-02](#ja-ex-02--対象の申請が承認済みになる) |\n| 申請Aは `rejected` | 申請Aを承認対象として選ぶ場面 | `submitted` という適用条件を満たさない。承認操作の成否・状態の扱いは未決定で、この行から却下・差戻し等は導かない | [JA-EX-02](#ja-ex-02--対象の申請が承認済みになる) |\n\n### JA-EX-02 — 対象の申請が承認済みになる\n\n- 人間レビュー状態：未レビュー\n- 条件・期待結果：[承認の条件・保証と例](#承認の条件保証と例)に示す JA-EX-02 の一般保証を参照。[同節の比較例](#承認の条件保証と例)\n- 根拠：[「Activity 購入申請を承認する」のWhen・Who・How・Result](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L170-L216)。Procedureの手順3とResultに状態が明記される。金額別の扱いは[未決定の事項](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L33-L44)である。\n- 導出分類：明示。AI確度：高。\n- 関連業務：「備品購入を申請する」で成立した申請を扱い、「承認済み備品を購入する」の購入対象へつなぐ。承認時点で購入は済まない。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。\n\n### JA-EX-Q01 — 金額によって承認者や承認段階が変わる場合の扱い\n\n- 種別：未決事項（候補）。業務設計自体で未決定の事項。\n- 人間レビュー状態：要確認\n- 条件：申請金額によって承認者や承認段階が変わる場合。\n- 期待結果：候補・未承認。どの承認者・承認段階を経て、いつ承認済みとするかは未決定。\n- 確認事項：金額別の承認経路を今回の業務設計で扱う必要が生じた場合、どの金額条件で誰の承認を必要とし、何をもって承認完了とするか。\n- 選択肢と影響：保留を続ける場合、この候補を実装上の合否条件に使わない。扱いを決める場合は、業務設計に条件と結果を記載して人間が確認した後、影響するチェック項目を更新する。金額境界や承認者をこの項目だけで決めない。\n- 根拠：[現在の業務設計で未決定の事項](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L33-L44)の最初の項目。\n- 導出分類：考慮候補。AI確度：要精査。\n- 関連業務：「購入申請を承認する」。新しい承認段階やActivityは定義しない。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。未決定の結果を、確定したテストの期待結果にしない。\n\n## 購入申請を却下する\n\n### 却下の条件・保証と例\n\n承認者が `submitted` の購入申請について購入を認めないと判断し、却下する対象購入申請と却下理由を**すべて必須入力**として却下する。[JA-EX-03](#ja-ex-03--対象の申請が却下済みになる) の一般保証は、対象購入申請が `rejected` になることである。別の独立した[JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない)の一般保証は、`rejected` である申請が購買担当者の購入対象にならないことであり、「承認済み備品を購入する」にも及ぶ。\n\n対象申請C（品名「椅子」、数量1、希望購入金額15,000、購入理由「破損した椅子の交換」）について、承認者が購入を認めず却下する場面を比べる。数値は許容範囲を示さない。\n\n| 対象の事前状態 | 対象選択 | 却下理由 | 観測する結果 | 対応 |\n| --- | --- | --- | --- | --- |\n| 申請Cは `submitted` | 申請C | 「購入を見送る」 | 却下後の申請Cが `rejected`。申請Cは購買対象にならない。状態変化と購買対象からの除外は別の保証 | [JA-EX-03](#ja-ex-03--対象の申請が却下済みになる)、[JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない) |\n| 申請Cは `submitted` | 申請C | 理由なし | 必須の却下理由を欠く。却下の成否や状態は未決定であり、`rejected` にならないとの逆向きの保証はない | [JA-EX-03](#ja-ex-03--対象の申請が却下済みになる) |\n| 申請Cは `rejected` | 購買担当者が申請Cを購入対象として扱おうとする場面 | 既に却下済みの理由はこの判定の入力ではない | 申請Cは購買対象にならない。却下操作を再実行する場合の結果までは決めない | [JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない) |\n\n### JA-EX-03 — 対象の申請が却下済みになる\n\n- 人間レビュー状態：未レビュー\n- 条件・期待結果：[却下の条件・保証と例](#却下の条件保証と例)に示す JA-EX-03 の一般保証を参照。[同節の比較例](#却下の条件保証と例)\n- 根拠：[「Activity 購入申請を却下する」のWhen・Who・How・Result](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L218-L265)。対象と理由は必須入力であり、Procedureの手順4とResultに状態が明記される。\n- 導出分類：明示。AI確度：高。根拠から期待結果を読み取れる確かさであり、人間の確認を代行しない。\n- 関連業務：「備品購入を申請する」で成立した申請を扱う。「承認済み備品を購入する」の対象から外す期待結果は JA-EX-04 を参照する。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。この記載はテストの不存在や実装不備を示さない。\n\n### JA-EX-04 — 却下済みの申請は購買対象にならない\n\n- 人間レビュー状態：未レビュー\n- 条件・期待結果：[却下の条件・保証と例](#却下の条件保証と例)に示す JA-EX-04 の一般保証を参照。[却下側の比較例](#却下の条件保証と例)・[購入側の比較例](#購入の条件保証と例)\n- 根拠：[「Activity 購入申請を却下する」のResult](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L261-L265)と[業務相関5](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L23-L31)に購買対象からの除外が明記される。\n- 導出分類：明示。AI確度：高。\n- 関連業務：「購入申請を却下する」と「承認済み備品を購入する」の共有項目。後者もこのIDを参照し、別のIDやレビュー状態を持たない。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。業務上の期待結果と検証証拠の有無は分けて扱う。\n\n## 承認済み備品を購入する\n\n共有する購買対象の除外保証は[JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない)の[条件・保証と例](#却下の条件保証と例)を参照する。\n\n### 購入の条件・保証と例\n\n購買担当者が `approved` の購入申請を確認し、それに基づいて対象備品を購入する。購入した対象購入申請の選択と実購入金額は**すべて必須入力**であり、購入結果を登録する。[JA-EX-05](#ja-ex-05--購入した対象の申請が購入済みになる)の一般保証は、購入した**その対象申請**が `purchased` になることである。必須入力があるだけで購入・登録が成立する十分条件や、入力を欠くときの失敗応答は定められていない。\n\n購買担当者が対象の備品を購入し、結果を登録する例1・2と、却下済みの申請を購入対象として扱おうとする例3を比べる。申請Dは品名「机」、希望購入金額20,000、申請Cは品名「椅子」である。金額は例示であり、希望額との差額の扱いはここでは決めない。\n\n| 対象 | 事前状態 | 対象選択 | 金額（実額／仮入力） | 観測する結果 |\n| --- | --- | --- | --- | --- |\n| [例1](#ja-ex-05--購入した対象の申請が購入済みになる)：申請D | `approved` | 購入した申請D | 19,500（実額） | 登録後、申請Dが `purchased` |\n| [例2](#ja-ex-05--購入した対象の申請が購入済みになる)：申請D | `approved` | 購入した申請D | 入力なし | 登録の成否・申請Dの状態は未決定 |\n| [例3](#ja-ex-04--却下済みの申請は購買対象にならない)：申請C | `rejected` | 申請Cを対象扱い | 15,000（仮入力） | 申請Cは購買対象にならない |\n\n- 例1の希望購入金額20,000と実購入金額19,500は別の情報であり、別申請の状態は保証の対象でない。例2は必須の実購入金額を欠くため、購入後の扱いも決めない。\n- 例3の15,000は対象扱いを試みる場面の仮入力であり、購入実績ではない。値の有無は共有の[JA-EX-04](#ja-ex-04--却下済みの申請は購買対象にならない)の除外保証を変えず、購入操作の失敗応答や状態遷移は定めない。\n\n### JA-EX-05 — 購入した対象の申請が購入済みになる\n\n- 人間レビュー状態：未レビュー\n- 条件・期待結果：[購入の条件・保証と例](#購入の条件保証と例)に示す JA-EX-05 の一般保証を参照。[同節の比較例](#購入の条件保証と例)\n- 根拠：[「Activity 承認済み備品を購入する」のWhen・Who・How・Result](https://github.com/mk3008/alder/blob/c2852531ad62691c375e87818d8c3a49fd19803f/business-design/purchase-request/README.md#L267-L314)。購入した対象と実購入金額は必須入力であり、Procedureの手順4とResultに状態が明記される。\n- 導出分類：明示。AI確度：高。\n- 関連業務：「購入申請を承認する」で承認された申請を扱う。「購入申請を却下する」からの除外条件は JA-EX-04 を参照する。購入後の備品管理などへの接続は定めない。\n- テスト証拠：対応する自動テスト・検証内容・実行結果は未収集。\n\n## 使い方\n\n業務一覧から各IDの項目へ進める。表やIDの並びは業務の実行順を示さない。IDごとに「確認」「修正」「保留」を伝える。IDの `JA-EX-` はこの例の中だけで使い、製品や過去の項目のIDを置き換えない。\n"
