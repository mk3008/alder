<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手順とチェックの検討例</title>
  <style>
    :root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#202830;background:#f4f7fa}
    body{margin:0}header{background:#163e68;color:white;padding:12px 20px}
    main{max-width:960px;margin:auto;padding:18px}h1{font-size:20px;margin:0}
    h2{font-size:18px;margin:22px 0 8px}p{margin:8px 0;line-height:1.5}
    .note{color:#56616d;font-size:14px}.scroll{overflow-x:auto}
    table{border-collapse:collapse;background:white;width:max-content;max-width:100%}
    th,td{border:1px solid #d0d9e2;padding:7px 10px;text-align:left;vertical-align:top}
    th{background:#edf3f8;white-space:nowrap}td{min-width:4em}
    td.data{min-width:10em}td.action{min-width:6em}a{color:#146597}
    .decision th,.decision td{min-width:0}
    .decision .result{border-left:2px solid #8193a5}
    .decision .check-id{white-space:nowrap;font-size:14px}
    .error{color:#a22424}.success{color:#146044}
    @media(max-width:600px){header{padding:10px 12px}main{padding:12px}th,td{padding:6px 8px}}
  </style>
</head>
<body>
  <header><h1>試合の開始を記録する</h1></header>
  <main>
    <p class="note">検討用モック。手順とチェックを同じ聞き取りの中で記録する例です。</p>
    <h2>手順</h2>
    <div class="scroll"><table aria-label="手順"><thead><tr><th>From</th><th>To</th><th>Data</th><th>Action</th></tr></thead><tbody id="steps"></tbody></table></div>
    <h2 id="checks-title">チェック項目（※1）</h2>
    <p class="note">上から順に判定し、最初に当てはまる行を見ます。‐＝値不問。</p>
    <div class="scroll"><table class="decision" aria-label="チェック項目"><thead><tr><th scope="colgroup" colspan="2">条件</th><th class="result" scope="col" rowspan="2">結果</th><th scope="col" rowspan="2">Check ID</th></tr><tr><th scope="col">参加者数</th><th scope="col">同名の人</th></tr></thead><tbody id="checks"></tbody></table></div>
    <p class="note">エラーの表示方法・文言と、同名の照合方法は未確認です。</p>
    <p class="note" id="status" role="status"></p>
  </main>
  <script type="module">
    const status=document.getElementById('status');
    try {
      const response=await fetch('./issue-340-molkky.json');
      if(!response.ok)throw Error('データを読み込めませんでした。');
      const source=await response.json();
      const names=new Map(source.parties.map(item=>[item.id,item.name]));
      const data=new Map(source.data.map(item=>[item.id,item.name]));
      const addCell=(row,value,css)=>{const cell=document.createElement('td');cell.textContent=value;if(css)cell.className=css;row.append(cell);return cell;};
      for(const step of source.steps){
        const row=document.createElement('tr');
        addCell(row,names.get(step.from));addCell(row,names.get(step.to));
        const cell=addCell(row,data.get(step.dataId),'data');
        if(step.checkIds.length){const link=document.createElement('a');link.href='#checks-title';link.textContent='（※1）';cell.append(link);}
        addCell(row,step.action,'action');document.getElementById('steps').append(row);
      }
      for(const [index,check] of source.checks.entries()){
        const row=document.createElement('tr'),count=check.conditions.find(c=>c.predicate==='count-in'||c.predicate==='count-at-least'),duplicate=check.conditions.find(c=>c.predicate==='duplicates-exist');
        // The last branch is "otherwise" only when its structured conditions are
        // exactly the complement of the two preceding participant checks.
        const previous=source.checks.slice(0,index);
        const few=previous.find(c=>c.conditions.length===1&&c.conditions[0].predicate==='count-in'&&c.conditions[0].dataId===count?.dataId&&JSON.stringify(c.conditions[0].values)==='[0,1]');
        const repeated=previous.find(c=>c.conditions.length===1&&c.conditions[0].predicate==='duplicates-exist'&&c.conditions[0].dataId===duplicate?.dataId&&c.conditions[0].fieldId===duplicate?.fieldId&&c.conditions[0].value===true);
        const otherwise=index===source.checks.length-1&&check.conditions.length===2&&count?.predicate==='count-at-least'&&count.value===2&&duplicate?.value===false&&count.dataId===duplicate.dataId&&few&&repeated;
        if(otherwise){const cell=addCell(row,'それ以外');cell.colSpan=2;}
        else{
          addCell(row,count?(count.predicate==='count-in'?count.values.join('人または')+'人':count.value+'人以上'):'‐');
          addCell(row,duplicate?(duplicate.value?'いる':'いない'):'‐');
        }
        const score=check.expected.effects.find(effect=>effect.action==='set-initial-score');
        const result=check.expected.outcome==='error'?'エラー':`開始。参加者名と順番、各自の初期${score.value}点を記録する`;
        addCell(row,result,`result ${check.expected.outcome==='error'?'error':'success'}`);
        addCell(row,check.id,'check-id');document.getElementById('checks').append(row);
      }
    } catch(error) {status.textContent=error.message;}
  </script>
</body>
</html>
